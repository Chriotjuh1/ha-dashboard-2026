claude_dark:
  # ── Brand palette (matched aan claude.ai) ─────────────────────
  claude-bg: "#262624"
  claude-bg-deep: "#1F1E1C"
  claude-surface: "#30302E"
  claude-surface-2: "#3A3936"
  claude-surface-3: "#46443F"
  claude-primary: "#C96342"          # Claude signature coral
  claude-primary-soft: "#D97757"
  claude-primary-deep: "#A84F32"
  claude-cream: "#F0EEE6"
  claude-cream-dim: "#D6D2C8"
  claude-muted: "#A8A29E"
  claude-muted-2: "#7A7570"
  claude-border: "rgba(240, 238, 230, 0.07)"
  claude-border-hover: "rgba(240, 238, 230, 0.14)"
  claude-success: "#7FB069"
  claude-warning: "#E8B86E"
  claude-danger: "#D96D6D"
  claude-info: "#7BA7C9"

  # ── Typography ────────────────────────────────────────────────
  claude-font-serif: "'Fraunces', 'Tiempos Headline', Georgia, serif"
  claude-font-sans: "'Inter', 'Styrene', -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
  paper-font-common-base_-_font-family: "var(--claude-font-sans)"
  paper-font-body1_-_font-family: "var(--claude-font-sans)"
  paper-font-subhead_-_font-family: "var(--claude-font-sans)"
  paper-font-headline_-_font-family: "var(--claude-font-serif)"
  paper-font-title_-_font-family: "var(--claude-font-serif)"

  # ── Core HA tokens ────────────────────────────────────────────
  primary-color: "var(--claude-primary)"
  accent-color: "var(--claude-primary-soft)"
  dark-primary-color: "var(--claude-primary-deep)"
  light-primary-color: "var(--claude-primary-soft)"

  primary-background-color: "var(--claude-bg)"
  secondary-background-color: "var(--claude-surface)"
  divider-color: "var(--claude-border)"
  scrollbar-thumb-color: "var(--claude-surface-3)"

  primary-text-color: "var(--claude-cream)"
  secondary-text-color: "var(--claude-muted)"
  disabled-text-color: "var(--claude-muted-2)"
  text-primary-color: "var(--claude-cream)"
  text-light-primary-color: "var(--claude-bg)"

  # App / sidebar — flat, geen schaduwen
  app-header-background-color: "var(--claude-bg)"
  app-header-text-color: "var(--claude-cream)"
  app-header-edit-background-color: "var(--claude-surface)"
  sidebar-background-color: "var(--claude-bg-deep)"
  sidebar-text-color: "var(--claude-cream-dim)"
  sidebar-icon-color: "var(--claude-muted)"
  sidebar-selected-background-color: "var(--claude-surface)"
  sidebar-selected-text-color: "var(--claude-primary)"
  sidebar-selected-icon-color: "var(--claude-primary)"

  # Cards — heel subtiel, claude.ai-style
  card-background-color: "var(--claude-surface)"
  ha-card-background: "var(--claude-surface)"
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--claude-border)"
  ha-card-box-shadow: "none"

  # State icons
  state-icon-color: "var(--claude-cream-dim)"
  state-icon-active-color: "var(--claude-primary)"
  state-icon-unavailable-color: "var(--claude-muted-2)"
  paper-item-icon-color: "var(--claude-cream-dim)"
  paper-item-icon-active-color: "var(--claude-primary)"

  state-light-active-color: "var(--claude-primary-soft)"
  state-switch-active-color: "var(--claude-primary)"
  state-fan-active-color: "var(--claude-info)"
  state-climate-auto-color: "var(--claude-success)"
  state-climate-cool-color: "var(--claude-info)"
  state-climate-heat-color: "var(--claude-primary)"
  state-binary_sensor-active-color: "var(--claude-warning)"
  state-binary_sensor-alerting-color: "var(--claude-danger)"

  # Sliders / switches
  paper-slider-active-color: "var(--claude-primary)"
  paper-slider-knob-color: "var(--claude-primary-soft)"
  paper-slider-knob-start-color: "var(--claude-primary)"
  paper-slider-pin-color: "var(--claude-primary)"
  paper-slider-secondary-color: "var(--claude-primary-deep)"
  switch-checked-color: "var(--claude-primary)"
  switch-checked-button-color: "var(--claude-primary-soft)"
  switch-checked-track-color: "var(--claude-primary-deep)"
  switch-unchecked-button-color: "var(--claude-muted)"
  switch-unchecked-track-color: "var(--claude-surface-3)"

  mdc-theme-primary: "var(--claude-primary)"
  mdc-theme-secondary: "var(--claude-primary-soft)"
  mdc-theme-on-primary: "var(--claude-cream)"
  mdc-button-outline-color: "var(--claude-border-hover)"

  # ── Material text fields & selects (input_datetime, input_number, etc.) ─
  mdc-text-field-fill-color: "var(--claude-surface-2)"
  mdc-text-field-disabled-fill-color: "var(--claude-surface)"
  mdc-text-field-ink-color: "var(--claude-cream)"
  mdc-text-field-disabled-ink-color: "var(--claude-muted-2)"
  mdc-text-field-label-ink-color: "var(--claude-muted)"
  mdc-text-field-idle-line-color: "var(--claude-border-hover)"
  mdc-text-field-hover-line-color: "var(--claude-primary-soft)"
  mdc-text-field-disabled-line-color: "var(--claude-border)"
  mdc-text-field-outlined-idle-border-color: "var(--claude-border-hover)"
  mdc-text-field-outlined-hover-border-color: "var(--claude-primary-soft)"
  mdc-text-field-outlined-disabled-border-color: "var(--claude-border)"
  mdc-select-fill-color: "var(--claude-surface-2)"
  mdc-select-ink-color: "var(--claude-cream)"
  mdc-select-label-ink-color: "var(--claude-muted)"
  mdc-select-idle-line-color: "var(--claude-border-hover)"
  mdc-select-hover-line-color: "var(--claude-primary-soft)"
  mdc-select-dropdown-icon-color: "var(--claude-muted)"
  mdc-select-outlined-idle-border-color: "var(--claude-border-hover)"
  mdc-select-outlined-hover-border-color: "var(--claude-primary-soft)"
  # Nieuwere MWC token-namen (sommige HA-componenten zijn al geüpdatet)
  mdc-filled-text-field-container-color: "var(--claude-surface-2)"
  mdc-filled-text-field-disabled-container-color: "var(--claude-surface)"

  # ── Material Web 3 tokens (md-sys-color-*) ────────────────────
  # Nieuwere HA-componenten (ha-md-select, ha-md-dialog, profielpagina-
  # dropdowns "Taal/Thema/Dashboard", picker-dialogs) gebruiken Material 3
  # i.p.v. de oude MDC-componenten. Zonder deze overrides blijven die
  # vakken WIT met onleesbare tekst.
  md-sys-color-background: "var(--claude-bg)"
  md-sys-color-on-background: "var(--claude-cream)"
  md-sys-color-surface: "var(--claude-surface)"
  md-sys-color-surface-dim: "var(--claude-bg-deep)"
  md-sys-color-surface-bright: "var(--claude-surface-2)"
  md-sys-color-surface-variant: "var(--claude-surface-2)"
  md-sys-color-surface-container-lowest: "var(--claude-bg-deep)"
  md-sys-color-surface-container-low: "var(--claude-surface)"
  md-sys-color-surface-container: "var(--claude-surface-2)"
  md-sys-color-surface-container-high: "var(--claude-surface-2)"
  md-sys-color-surface-container-highest: "var(--claude-surface-3)"
  md-sys-color-on-surface: "var(--claude-cream)"
  md-sys-color-on-surface-variant: "var(--claude-muted)"
  md-sys-color-inverse-surface: "var(--claude-cream)"
  md-sys-color-inverse-on-surface: "var(--claude-bg)"
  md-sys-color-primary: "var(--claude-primary)"
  md-sys-color-on-primary: "var(--claude-cream)"
  md-sys-color-primary-container: "var(--claude-surface-3)"
  md-sys-color-on-primary-container: "var(--claude-cream)"
  md-sys-color-inverse-primary: "var(--claude-primary-deep)"
  md-sys-color-secondary: "var(--claude-primary-soft)"
  md-sys-color-on-secondary: "var(--claude-cream)"
  md-sys-color-secondary-container: "var(--claude-surface-2)"
  md-sys-color-on-secondary-container: "var(--claude-cream)"
  md-sys-color-tertiary: "var(--claude-info)"
  md-sys-color-on-tertiary: "var(--claude-cream)"
  md-sys-color-tertiary-container: "var(--claude-surface-2)"
  md-sys-color-on-tertiary-container: "var(--claude-cream)"
  md-sys-color-error: "var(--claude-danger)"
  md-sys-color-on-error: "var(--claude-cream)"
  md-sys-color-error-container: "var(--claude-surface-2)"
  md-sys-color-on-error-container: "var(--claude-danger)"
  md-sys-color-outline: "var(--claude-border-hover)"
  md-sys-color-outline-variant: "var(--claude-border)"
  md-sys-color-shadow: "rgba(0, 0, 0, 0.4)"
  md-sys-color-scrim: "rgba(0, 0, 0, 0.6)"

  # ── Dialogs & menus (more-info popups, dropdowns) ─────────────
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.6)"
  mdc-dialog-heading-ink-color: "var(--claude-cream)"
  mdc-dialog-content-ink-color: "var(--claude-cream-dim)"
  mdc-theme-surface: "var(--claude-surface)"
  mdc-theme-on-surface: "var(--claude-cream)"
  mdc-theme-text-primary-on-background: "var(--claude-cream)"
  mdc-theme-text-secondary-on-background: "var(--claude-muted)"
  mdc-menu-surface-fill-color: "var(--claude-surface-2)"
  mdc-list-item-text-color: "var(--claude-cream)"
  mdc-list-item-graphic-color: "var(--claude-cream-dim)"
  mdc-list-item-meta-color: "var(--claude-muted)"
  ha-dialog-border-radius: "20px"

  # ── Snackbar / toast / "configuratie gewijzigd" banner ────────
  mdc-snackbar-background-color: "var(--claude-surface)"
  mdc-snackbar-color: "var(--claude-cream)"
  mdc-snackbar-action-color: "var(--claude-primary)"

  # ── Buttons (default text color) ──────────────────────────────
  mdc-button-color: "var(--claude-cream)"

  # ── Card headers (titles van entities-card, history-graph, etc.) ─
  ha-card-header-color: "var(--claude-cream)"
  ha-card-header-font-family: "var(--claude-font-serif)"
  ha-card-header-font-size: "20px"
  ha-card-header-font-weight: "400"
  ha-card-header-letter-spacing: "-0.01em"

  # ── More-info / dialogs ──────────────────────────────────────
  more-info-header-background: "var(--claude-surface)"
  more-info-header-color: "var(--claude-cream)"

  # ── Buttons ──────────────────────────────────────────────────
  mdc-button-disabled-ink-color: "var(--claude-muted-2)"
  ha-button-toggle-group-button-bg-color: "var(--claude-surface-2)"

  # ── Input controls (sliders, time pickers, color picker) ─────
  paper-input-container-color: "var(--claude-muted)"
  paper-input-container-focus-color: "var(--claude-primary)"
  paper-input-container-input-color: "var(--claude-cream)"
  paper-time-input-color: "var(--claude-cream)"

  # ── Tabs (dashboard view tabs aan de top) ────────────────────
  paper-tabs-selection-bar-color: "var(--claude-primary)"
  paper-tab-ink: "var(--claude-primary)"

  label-badge-background-color: "var(--claude-surface-2)"
  label-badge-text-color: "var(--claude-cream)"
  label-badge-red: "var(--claude-danger)"
  label-badge-green: "var(--claude-success)"
  label-badge-blue: "var(--claude-info)"
  label-badge-yellow: "var(--claude-warning)"

  error-color: "var(--claude-danger)"
  warning-color: "var(--claude-warning)"
  success-color: "var(--claude-success)"
  info-color: "var(--claude-info)"

  code-editor-background-color: "var(--claude-surface)"
  markdown-code-background-color: "var(--claude-surface-2)"

  # Energy graph palette
  energy-grid-consumption-color: "var(--claude-info)"
  energy-grid-return-color: "var(--claude-success)"
  energy-solar-color: "var(--claude-warning)"
  energy-battery-in-color: "var(--claude-primary)"
  energy-battery-out-color: "var(--claude-primary-soft)"
  energy-non-fossil-color: "var(--claude-success)"

  # Mushroom token overrides
  mush-rgb-primary: "201, 99, 66"
  mush-rgb-accent: "217, 119, 87"
  mush-rgb-info: "123, 167, 201"
  mush-rgb-success: "127, 176, 105"
  mush-rgb-warning: "232, 184, 110"
  mush-rgb-danger: "217, 109, 109"
  mush-rgb-disabled: "168, 162, 158"
  mush-card-primary-font-size: "15px"
  mush-card-secondary-font-size: "13px"
  mush-control-border-radius: "12px"
  mush-control-height: "42px"

  # ── Card-mod global injectie (Google Fonts + claude classes) ──
  # Vereist card-mod (HACS). De .claude-* classes worden gebruikt
  # in markdown-cards van het Claude dashboard.
  card-mod-theme: claude_dark
  card-mod-root-yaml: |
    ".": |
      html, body {
        font-family: var(--claude-font-sans);
        letter-spacing: -0.005em;
      }
      /* Responsive: kleine schermen */
      @media (max-width: 600px) {
        .header .toolbar { padding: 0 8px !important; }
      }
    "ha-panel-profile$": |
      /* Set CSS vars directly on ha-select elements (outer author declaration beats
         inner :host default, so this overrides the white fill that CSS variable
         inheritance from html cannot override). Covers both MDC and MD3 builds. */
      ha-select,
      ha-md-select {
        --mdc-select-fill-color: #3A3936;
        --mdc-select-ink-color: #F0EEE6;
        --mdc-select-label-ink-color: #A8A29E;
        --mdc-select-dropdown-icon-color: #A8A29E;
        --mdc-theme-surface: #3A3936;
        --mdc-theme-on-surface: #F0EEE6;
        --md-sys-color-surface-container-highest: #46443F;
        --md-sys-color-surface-container: #3A3936;
        --md-sys-color-on-surface: #F0EEE6;
        --md-filled-select-text-field-container-color: #3A3936;
        --md-filled-select-text-field-input-text-color: #F0EEE6;
        --md-filled-select-text-field-label-text-color: #A8A29E;
        --md-outlined-select-text-field-input-text-color: #F0EEE6;
        --md-outlined-select-text-field-label-text-color: #A8A29E;
        --md-outlined-select-text-field-outline-color: rgba(240,238,230,0.14);
      }
      /* Fallback for native <select> */
      select {
        background: #3A3936 !important;
        color: #F0EEE6 !important;
        border-color: rgba(240,238,230,0.14) !important;
      }
      /* Buttons (o.a. "Bewerken" bij de zijbalk): koraal accent zodat de
         hover-/focus-state geen witte vlek wordt. */
      mwc-button,
      ha-button {
        --mdc-theme-primary: #D97757;
        --mdc-theme-on-primary: #1F1E1C;
        --mdc-ripple-color: #D97757;
        --mdc-button-outline-color: rgba(240,238,230,0.18);
        --md-sys-color-primary: #D97757;
        --md-sys-color-on-primary: #1F1E1C;
      }
      /* Destructieve knoppen ("Afmelden") krijgen claude-danger i.p.v. fel rood. */
      mwc-button.warning,
      ha-button.warning,
      a.warning,
      [class*="destructive"] {
        --mdc-theme-primary: #D96D6D !important;
        --mdc-ripple-color: #D96D6D !important;
        --md-sys-color-primary: #D96D6D !important;
        color: #D96D6D !important;
      }
      /* MD3-knopvarianten ("Bewerken" e.d. kunnen filled-tonal zijn) → koraal */
      md-filled-tonal-button,
      md-text-button,
      md-outlined-button,
      md-filled-button,
      md-elevated-button {
        --md-sys-color-primary: #D97757 !important;
        --md-sys-color-on-primary: #1F1E1C !important;
        --md-sys-color-secondary-container: #3A3936 !important;
        --md-sys-color-on-secondary-container: #D97757 !important;
        --md-filled-tonal-button-container-color: #3A3936 !important;
        --md-filled-tonal-button-label-text-color: #D97757 !important;
        --md-text-button-label-text-color: #D97757 !important;
        --md-outlined-button-label-text-color: #D97757 !important;
        --md-outlined-button-outline-color: rgba(240,238,230,0.18) !important;
        --md-filled-button-container-color: #C96342 !important;
        --md-filled-button-label-text-color: #F0EEE6 !important;
      }
      /* Tekstlinks in de profielpagina (o.a. "Bewerken") → koraal i.p.v.
         blauw/cyaan default. Behalve de .warning-variant hierboven. */
      a:not(.warning),
      a:link:not(.warning),
      a:visited:not(.warning) {
        color: #D97757 !important;
      }
    "ha-panel-profile$ ha-select$": |
      /* Inside ha-select shadow root: override MDC fill + label classes */
      .mdc-select__anchor,
      .mdc-select__fill {
        background-color: #3A3936 !important;
      }
      .mdc-select__selected-text,
      .mdc-select__selected-text-container {
        color: #F0EEE6 !important;
      }
      .mdc-floating-label,
      .mdc-floating-label--float-above {
        color: #A8A29E !important;
      }
      .mdc-select__dropdown-icon {
        fill: #A8A29E !important;
      }
      mwc-select,
      md-filled-select,
      md-outlined-select {
        --mdc-select-fill-color: #3A3936;
        --mdc-theme-surface: #3A3936;
        --md-filled-select-text-field-container-color: #3A3936;
      }
    "ha-panel-profile$ ha-select$ mwc-select$": |
      :host {
        --mdc-select-fill-color: #3A3936 !important;
        --mdc-select-ink-color: #F0EEE6 !important;
        --mdc-theme-surface: #3A3936 !important;
        --mdc-theme-on-surface: #F0EEE6 !important;
      }
      .mdc-select__anchor {
        background-color: #3A3936 !important;
      }
      .mdc-select__selected-text {
        color: #F0EEE6 !important;
      }
      .mdc-floating-label {
        color: #A8A29E !important;
      }
    "ha-panel-profile$ mwc-button$": |
      /* Tem de hover/focus state-layer: subtiele koraal i.p.v. wit, en
         houd de knoptekst leesbaar. */
      :host {
        --mdc-theme-primary: #D97757 !important;
        --mdc-ripple-color: #D97757 !important;
      }
      .mdc-button__ripple::before,
      .mdc-button__ripple::after {
        background-color: #D97757 !important;
      }
      .mdc-button:hover .mdc-button__ripple::before {
        opacity: 0.14 !important;
      }
      .mdc-button:focus .mdc-button__ripple::before {
        opacity: 0.18 !important;
      }
      .mdc-button__label,
      .mdc-button .mdc-button__label {
        color: #D97757 !important;
      }
    "ha-panel-profile$ ha-button$ mwc-button$": |
      :host {
        --mdc-theme-primary: #D97757 !important;
        --mdc-ripple-color: #D97757 !important;
      }
      .mdc-button__ripple::before,
      .mdc-button__ripple::after {
        background-color: #D97757 !important;
      }
      .mdc-button:hover .mdc-button__ripple::before {
        opacity: 0.14 !important;
      }
      .mdc-button:focus .mdc-button__ripple::before {
        opacity: 0.18 !important;
      }
      .mdc-button__label {
        color: #D97757 !important;
      }
    "ha-panel-profile$ mwc-button.warning$": |
      /* "Afmelden" en andere destructieve knoppen → muted-red. */
      :host {
        --mdc-theme-primary: #D96D6D !important;
        --mdc-ripple-color: #D96D6D !important;
      }
      .mdc-button__ripple::before,
      .mdc-button__ripple::after {
        background-color: #D96D6D !important;
      }
      .mdc-button__label {
        color: #D96D6D !important;
      }
    "ha-switch$": |
      /* Switches (o.a. "Geavanceerde modus") globaal naar koraal i.p.v.
         de blauwe MDC/MD3-default. */
      :host {
        --switch-checked-color: #D97757 !important;
        --switch-checked-button-color: #C96342 !important;
        --switch-checked-track-color: #C96342 !important;
        --mdc-theme-secondary: #D97757 !important;
        --mdc-switch-selected-track-color: #D97757 !important;
        --mdc-switch-selected-handle-color: #C96342 !important;
        --mdc-switch-selected-icon-color: #F0EEE6 !important;
        --mdc-switch-selected-focus-track-color: #D97757 !important;
        --mdc-switch-selected-hover-track-color: #D97757 !important;
        --mdc-switch-selected-pressed-track-color: #D97757 !important;
        --mdc-switch-selected-focus-handle-color: #C96342 !important;
        --mdc-switch-selected-hover-handle-color: #C96342 !important;
        --mdc-switch-selected-pressed-handle-color: #C96342 !important;
        --md-sys-color-primary: #D97757 !important;
        --md-switch-selected-handle-color: #C96342 !important;
        --md-switch-selected-track-color: #D97757 !important;
        --md-switch-selected-icon-color: #F0EEE6 !important;
      }
    "ha-switch$ mwc-switch$": |
      :host {
        --mdc-switch-selected-track-color: #D97757 !important;
        --mdc-switch-selected-handle-color: #C96342 !important;
        --mdc-theme-secondary: #D97757 !important;
      }
      .mdc-switch--selected .mdc-switch__track::after,
      .mdc-switch--selected .mdc-switch__track::before {
        background-color: #D97757 !important;
        border-color: #D97757 !important;
      }
      .mdc-switch--selected .mdc-switch__handle::after {
        background-color: #C96342 !important;
      }
    "ha-expansion-panel$": |
      /* "Geavanceerde opties" en andere inklap-headers (komen in dialogs door
         heel HA voor). De header rendert standaard met een lichte achtergrond;
         we forceren de dark surface en cream tekst. Geldt globaal, niet alleen
         op de profielpagina. */
      :host {
        --ha-card-background: #30302E !important;
        --card-background-color: #30302E !important;
        --primary-text-color: #F0EEE6 !important;
        --secondary-text-color: #A8A29E !important;
        --md-sys-color-surface: #30302E !important;
        --md-sys-color-surface-container: #30302E !important;
        --md-sys-color-surface-container-low: #30302E !important;
        --md-sys-color-surface-container-high: #3A3936 !important;
        --md-sys-color-surface-container-highest: #3A3936 !important;
        --md-sys-color-on-surface: #F0EEE6 !important;
        --md-sys-color-on-surface-variant: #A8A29E !important;
        --mdc-theme-surface: #30302E !important;
        --mdc-theme-on-surface: #F0EEE6 !important;
      }
      .top,
      .summary,
      .container,
      .header,
      [class*="summary"],
      [class*="header"] {
        background-color: #30302E !important;
        color: #F0EEE6 !important;
      }
      .icon,
      ha-svg-icon,
      ha-icon-button {
        color: #A8A29E !important;
        --mdc-icon-button-ink-color: #A8A29E !important;
      }
    "ha-md-list-item$": |
      /* Material 3 list items (komen voor in dezelfde dialogs). */
      :host {
        --md-sys-color-surface: #30302E !important;
        --md-sys-color-surface-container: #30302E !important;
        --md-sys-color-on-surface: #F0EEE6 !important;
        --md-sys-color-on-surface-variant: #A8A29E !important;
      }
    "md-switch$": |
      /* MD3 switch variant — komt voor naast / i.p.v. de MDC ha-switch */
      :host {
        --md-sys-color-primary: #D97757 !important;
        --md-switch-selected-track-color: #D97757 !important;
        --md-switch-selected-handle-color: #C96342 !important;
        --md-switch-selected-icon-color: #F0EEE6 !important;
        --md-switch-selected-focus-track-color: #D97757 !important;
        --md-switch-selected-hover-track-color: #D97757 !important;
        --md-switch-selected-pressed-track-color: #D97757 !important;
        --md-switch-selected-focus-handle-color: #C96342 !important;
        --md-switch-selected-hover-handle-color: #C96342 !important;
        --md-switch-selected-pressed-handle-color: #C96342 !important;
      }
    "ha-textfield$": |
      /* Tekstvakken (o.a. "Huidig wachtwoord") globaal donker — anders typ je
         witte tekst op een witte achtergrond. */
      :host {
        --mdc-text-field-fill-color: #3A3936 !important;
        --mdc-text-field-ink-color: #F0EEE6 !important;
        --mdc-text-field-label-ink-color: #A8A29E !important;
        --mdc-text-field-idle-line-color: rgba(240,238,230,0.14) !important;
        --mdc-text-field-hover-line-color: #D97757 !important;
        --mdc-text-field-focused-label-color: #D97757 !important;
        --mdc-text-field-outlined-idle-border-color: rgba(240,238,230,0.18) !important;
        --mdc-text-field-outlined-hover-border-color: #D97757 !important;
        --mdc-text-field-outlined-disabled-border-color: rgba(240,238,230,0.06) !important;
        --mdc-filled-text-field-container-color: #3A3936 !important;
        --mdc-filled-text-field-disabled-container-color: #30302E !important;
        --md-sys-color-surface-container-highest: #3A3936 !important;
        --md-sys-color-on-surface: #F0EEE6 !important;
        --md-sys-color-on-surface-variant: #A8A29E !important;
        --md-sys-color-primary: #D97757 !important;
        --md-filled-text-field-container-color: #3A3936 !important;
        --md-filled-text-field-input-text-color: #F0EEE6 !important;
        --md-filled-text-field-label-text-color: #A8A29E !important;
        --md-filled-text-field-focus-label-text-color: #D97757 !important;
        --md-outlined-text-field-input-text-color: #F0EEE6 !important;
        --md-outlined-text-field-label-text-color: #A8A29E !important;
        --md-outlined-text-field-outline-color: rgba(240,238,230,0.18) !important;
      }
      .mdc-text-field,
      .mdc-text-field--filled,
      .mdc-text-field__resizer {
        background-color: #3A3936 !important;
      }
      .mdc-text-field__input,
      input,
      textarea {
        color: #F0EEE6 !important;
        caret-color: #F0EEE6 !important;
        -webkit-text-fill-color: #F0EEE6 !important;
      }
      .mdc-floating-label,
      .mdc-floating-label--float-above {
        color: #A8A29E !important;
      }
    "mwc-textfield$": |
      :host {
        --mdc-text-field-fill-color: #3A3936 !important;
        --mdc-text-field-ink-color: #F0EEE6 !important;
        --mdc-text-field-label-ink-color: #A8A29E !important;
      }
      .mdc-text-field, .mdc-text-field--filled { background-color: #3A3936 !important; }
      input { color: #F0EEE6 !important; caret-color: #F0EEE6 !important; }
    "ha-md-textfield$": |
      :host {
        --md-sys-color-surface-container-highest: #3A3936 !important;
        --md-filled-text-field-container-color: #3A3936 !important;
        --md-filled-text-field-input-text-color: #F0EEE6 !important;
        --md-filled-text-field-label-text-color: #A8A29E !important;
      }
    "md-filled-text-field$": |
      :host {
        --md-filled-text-field-container-color: #3A3936 !important;
        --md-filled-text-field-input-text-color: #F0EEE6 !important;
        --md-filled-text-field-label-text-color: #A8A29E !important;
        --md-filled-text-field-focus-label-text-color: #D97757 !important;
      }
    "md-outlined-text-field$": |
      :host {
        --md-outlined-text-field-input-text-color: #F0EEE6 !important;
        --md-outlined-text-field-label-text-color: #A8A29E !important;
        --md-outlined-text-field-outline-color: rgba(240,238,230,0.18) !important;
        --md-outlined-text-field-focus-outline-color: #D97757 !important;
      }
    "ha-time-input$": |
      /* Nieuwere HA: ha-time-input → ha-base-time-input → ha-input →
         wa-input. We propageren door zodat ook number-inputs binnen
         wa-input transparant zijn over de donkere .text-field-div. */
      input[type="number"] {
        background: transparent !important;
        color: #F0EEE6 !important;
        caret-color: #F0EEE6 !important;
        color-scheme: dark !important;
      }
    "ha-base-time-input$": |
      input[type="number"] {
        background: transparent !important;
        color: #F0EEE6 !important;
        color-scheme: dark !important;
      }
    "ha-input$": |
      :host {
        color-scheme: dark;
        --wa-color-surface-default: #3A3936 !important;
        --wa-color-text-normal: #F0EEE6 !important;
        --wa-color-text-quiet: #A8A29E !important;
        --wa-color-border-default: rgba(240,238,230,0.14) !important;
        --wa-form-control-background-color: #3A3936 !important;
        --wa-form-control-border-color: rgba(240,238,230,0.14) !important;
      }
    "ha-input$ wa-input$": |
      /* Web Awesome input: de witte bak is <div part="base" class="text-field">.
         Recolor + recolor de input erin. */
      :host {
        color-scheme: dark;
        --wa-color-surface-default: #3A3936 !important;
        --wa-color-text-normal: #F0EEE6 !important;
        --wa-color-text-quiet: #A8A29E !important;
        --wa-form-control-background-color: #3A3936 !important;
        --wa-form-control-border-color: rgba(240,238,230,0.14) !important;
      }
      .text-field,
      [part="base"] {
        background: #3A3936 !important;
        background-color: #3A3936 !important;
        border: 1px solid rgba(240,238,230,0.14) !important;
        border-radius: 8px !important;
        color: #F0EEE6 !important;
      }
      .control,
      input,
      input[part="input"] {
        background: transparent !important;
        color: #F0EEE6 !important;
        caret-color: #F0EEE6 !important;
        -webkit-text-fill-color: #F0EEE6 !important;
      }
      .label,
      [part="form-control-label"] {
        color: #A8A29E !important;
      }
    "wa-input$": |
      :host {
        color-scheme: dark;
        --wa-color-surface-default: #3A3936 !important;
        --wa-color-text-normal: #F0EEE6 !important;
        --wa-form-control-background-color: #3A3936 !important;
      }
      .text-field,
      [part="base"] {
        background: #3A3936 !important;
        background-color: #3A3936 !important;
        border: 1px solid rgba(240,238,230,0.14) !important;
        border-radius: 8px !important;
        color: #F0EEE6 !important;
      }
      .control,
      input,
      input[part="input"] {
        background: transparent !important;
        color: #F0EEE6 !important;
        caret-color: #F0EEE6 !important;
        -webkit-text-fill-color: #F0EEE6 !important;
      }
      .label,
      [part="form-control-label"] {
        color: #A8A29E !important;
      }
  card-mod-view-yaml: |
    ".": |
      hui-view, hui-sections-view {
        padding-top: 8px !important;
      }
      /* Op telefoon: minder padding aan de zijkanten */
      @media (max-width: 600px) {
        hui-view, hui-sections-view {
          padding-left: 8px !important;
          padding-right: 8px !important;
        }
      }
      /* Time picker velden: forceer dark surface */
      ha-time-input,
      paper-time-input,
      mwc-textfield,
      ha-textfield {
        --mdc-text-field-fill-color: var(--claude-surface-2) !important;
        --mdc-text-field-ink-color: var(--claude-cream) !important;
        --mdc-text-field-label-ink-color: var(--claude-muted) !important;
        --mdc-text-field-idle-line-color: transparent !important;
        --mdc-text-field-hover-line-color: var(--claude-primary-soft) !important;
        --mdc-text-field-outlined-idle-border-color: var(--claude-border-hover) !important;
        --mdc-text-field-outlined-hover-border-color: var(--claude-primary-soft) !important;
      }
      /* Entities card title (h1.card-header) → Fraunces serif */
      ha-card .card-header,
      ha-card .card-header .name,
      ha-card h1.card-header {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
        font-size: 22px !important;
        letter-spacing: -0.01em !important;
        color: var(--claude-cream) !important;
      }
      /* hui-entities-card title fallback (waar h1 niet gebruikt wordt) */
      hui-entities-card .card-header {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
      }
  card-mod-card-yaml: |
    "ha-markdown $": |
      /* ── Heroes ── */
      .claude-hero-title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
        font-size: clamp(34px, 7vw, 52px) !important;
        line-height: 1.05 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
        margin: 0 0 10px 0 !important;
        display: block !important;
      }
      .claude-hero-sub {
        font-family: 'Inter', sans-serif !important;
        font-size: 14px !important;
        color: var(--claude-muted) !important;
        line-height: 1.5 !important;
        display: block !important;
        margin: 0 !important;
      }
      .claude-accent { color: var(--claude-primary) !important; }

      /* ── Section titles ── */
      .claude-section-title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
        font-size: 26px !important;
        letter-spacing: -0.01em !important;
        color: var(--claude-cream) !important;
        margin: 16px 4px 8px !important;
        display: block !important;
      }

      /* ── Stat cards ── */
      .claude-label {
        font-size: 11px !important;
        font-weight: 500 !important;
        letter-spacing: 0.08em !important;
        text-transform: uppercase !important;
        color: var(--claude-muted) !important;
        margin: 0 0 10px 0 !important;
        display: block !important;
      }
      .claude-figure {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 32px !important;
        font-weight: 400 !important;
        line-height: 1 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
      }
      .claude-figure-small {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 22px !important;
        font-weight: 400 !important;
        line-height: 1 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
      }
      .claude-unit {
        font-size: 13px !important;
        color: var(--claude-muted) !important;
        margin-left: 4px !important;
      }
      .claude-delta {
        font-size: 12px !important;
        color: var(--claude-primary) !important;
        margin-top: 6px !important;
        display: block !important;
      }
      .claude-delta-muted { color: var(--claude-muted) !important; }
      .claude-delta-cream { color: var(--claude-cream-dim) !important; }

      /* ── Person row ── */
      .claude-persons {
        display: grid !important;
        grid-template-columns: 1fr 1fr 1fr !important;
        gap: 10px !important;
      }
      .claude-person {
        background: var(--claude-surface) !important;
        border: 1px solid var(--claude-border) !important;
        border-radius: 16px !important;
        padding: 18px 12px !important;
        text-align: center !important;
      }
      .claude-avatar {
        width: 56px !important;
        height: 56px !important;
        border-radius: 50% !important;
        margin: 0 auto 10px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 22px !important;
        font-weight: 400 !important;
        color: #F0EEE6 !important;
      }
      .claude-avatar-cj { background: linear-gradient(135deg, #C96342, #A84F32) !important; }
      .claude-avatar-mj { background: linear-gradient(135deg, #7BA7C9, #4A6E8A) !important; }
      .claude-avatar-ej { background: linear-gradient(135deg, #7FB069, #4A7B4A) !important; }
      .claude-name {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 16px !important;
        color: var(--claude-cream) !important;
        display: block !important;
      }
      .claude-state {
        font-size: 11px !important;
        color: var(--claude-muted) !important;
        margin-top: 2px !important;
        display: block !important;
      }

      /* ── Alert ── */
      .claude-alert-title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 22px !important;
        font-weight: 400 !important;
        color: var(--claude-cream) !important;
        display: block !important;
        margin-bottom: 4px !important;
      }
      .claude-alert-body {
        font-size: 13px !important;
        color: var(--claude-cream-dim) !important;
        display: block !important;
      }
