claude_dark:
  # ── Brand palette (matched aan claude.ai) ─────────────────────
  claude-bg: "#262624"
  claude-bg-deep: "#1F1E1C"
  claude-surface: "#30302E"
  claude-surface-2: "#3A3936"
  claude-surface-3: "#46443F"
  claude-primary: "#C96342"          # Claude signature coral
  claude-primary-soft: "#D97757"
  claude-primary-deep: "#A84F32"
  claude-cream: "#F0EEE6"
  claude-cream-dim: "#D6D2C8"
  claude-muted: "#A8A29E"
  claude-muted-2: "#7A7570"
  claude-border: "rgba(240, 238, 230, 0.07)"
  claude-border-hover: "rgba(240, 238, 230, 0.14)"
  claude-success: "#7FB069"
  claude-warning: "#E8B86E"
  claude-danger: "#D96D6D"
  claude-info: "#7BA7C9"

  # ── Typography ────────────────────────────────────────────────
  claude-font-serif: "'Fraunces', 'Tiempos Headline', Georgia, serif"
  claude-font-sans: "'Inter', 'Styrene', -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
  paper-font-common-base_-_font-family: "var(--claude-font-sans)"
  paper-font-body1_-_font-family: "var(--claude-font-sans)"
  paper-font-subhead_-_font-family: "var(--claude-font-sans)"
  paper-font-headline_-_font-family: "var(--claude-font-serif)"
  paper-font-title_-_font-family: "var(--claude-font-serif)"

  # ── Core HA tokens ────────────────────────────────────────────
  primary-color: "var(--claude-primary)"
  accent-color: "var(--claude-primary-soft)"
  dark-primary-color: "var(--claude-primary-deep)"
  light-primary-color: "var(--claude-primary-soft)"

  primary-background-color: "var(--claude-bg)"
  secondary-background-color: "var(--claude-surface)"
  divider-color: "var(--claude-border)"
  scrollbar-thumb-color: "var(--claude-surface-3)"

  primary-text-color: "var(--claude-cream)"
  secondary-text-color: "var(--claude-muted)"
  disabled-text-color: "var(--claude-muted-2)"
  text-primary-color: "var(--claude-cream)"
  text-light-primary-color: "var(--claude-bg)"

  # App / sidebar — flat, geen schaduwen
  app-header-background-color: "var(--claude-bg)"
  app-header-text-color: "var(--claude-cream)"
  app-header-edit-background-color: "var(--claude-surface)"
  sidebar-background-color: "var(--claude-bg-deep)"
  sidebar-text-color: "var(--claude-cream-dim)"
  sidebar-icon-color: "var(--claude-muted)"
  sidebar-selected-background-color: "var(--claude-surface)"
  sidebar-selected-text-color: "var(--claude-primary)"
  sidebar-selected-icon-color: "var(--claude-primary)"

  # Cards — heel subtiel, claude.ai-style
  card-background-color: "var(--claude-surface)"
  ha-card-background: "var(--claude-surface)"
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--claude-border)"
  ha-card-box-shadow: "none"

  # State icons
  state-icon-color: "var(--claude-cream-dim)"
  state-icon-active-color: "var(--claude-primary)"
  state-icon-unavailable-color: "var(--claude-muted-2)"
  paper-item-icon-color: "var(--claude-cream-dim)"
  paper-item-icon-active-color: "var(--claude-primary)"

  state-light-active-color: "var(--claude-primary-soft)"
  state-switch-active-color: "var(--claude-primary)"
  state-fan-active-color: "var(--claude-info)"
  state-climate-auto-color: "var(--claude-success)"
  state-climate-cool-color: "var(--claude-info)"
  state-climate-heat-color: "var(--claude-primary)"
  state-binary_sensor-active-color: "var(--claude-warning)"
  state-binary_sensor-alerting-color: "var(--claude-danger)"

  # Sliders / switches
  paper-slider-active-color: "var(--claude-primary)"
  paper-slider-knob-color: "var(--claude-primary-soft)"
  paper-slider-knob-start-color: "var(--claude-primary)"
  paper-slider-pin-color: "var(--claude-primary)"
  paper-slider-secondary-color: "var(--claude-primary-deep)"
  switch-checked-color: "var(--claude-primary)"
  switch-checked-button-color: "var(--claude-primary-soft)"
  switch-checked-track-color: "var(--claude-primary-deep)"
  switch-unchecked-button-color: "var(--claude-muted)"
  switch-unchecked-track-color: "var(--claude-surface-3)"

  mdc-theme-primary: "var(--claude-primary)"
  mdc-theme-secondary: "var(--claude-primary-soft)"
  mdc-theme-on-primary: "var(--claude-cream)"
  mdc-button-outline-color: "var(--claude-border-hover)"

  label-badge-background-color: "var(--claude-surface-2)"
  label-badge-text-color: "var(--claude-cream)"
  label-badge-red: "var(--claude-danger)"
  label-badge-green: "var(--claude-success)"
  label-badge-blue: "var(--claude-info)"
  label-badge-yellow: "var(--claude-warning)"

  error-color: "var(--claude-danger)"
  warning-color: "var(--claude-warning)"
  success-color: "var(--claude-success)"
  info-color: "var(--claude-info)"

  code-editor-background-color: "var(--claude-surface)"
  markdown-code-background-color: "var(--claude-surface-2)"

  # Energy graph palette
  energy-grid-consumption-color: "var(--claude-info)"
  energy-grid-return-color: "var(--claude-success)"
  energy-solar-color: "var(--claude-warning)"
  energy-battery-in-color: "var(--claude-primary)"
  energy-battery-out-color: "var(--claude-primary-soft)"
  energy-non-fossil-color: "var(--claude-success)"

  # Mushroom token overrides
  mush-rgb-primary: "201, 99, 66"
  mush-rgb-accent: "217, 119, 87"
  mush-rgb-info: "123, 167, 201"
  mush-rgb-success: "127, 176, 105"
  mush-rgb-warning: "232, 184, 110"
  mush-rgb-danger: "217, 109, 109"
  mush-rgb-disabled: "168, 162, 158"
  mush-card-primary-font-size: "15px"
  mush-card-secondary-font-size: "13px"
  mush-control-border-radius: "12px"
  mush-control-height: "42px"

  # ── Card-mod global injectie (Google Fonts + claude classes) ──
  # Vereist card-mod (HACS). De .claude-* classes worden gebruikt
  # in markdown-cards van het Claude dashboard.
  card-mod-theme: claude_dark
  card-mod-root-yaml: |
    ".": |
      html, body {
        font-family: var(--claude-font-sans);
        letter-spacing: -0.005em;
      }
  card-mod-view-yaml: |
    ".": |
      hui-view, hui-sections-view {
        padding-top: 8px !important;
      }
  card-mod-card-yaml: |
    "ha-markdown $": |
      /* ── Heroes ── */
      .claude-hero-title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
        font-size: clamp(34px, 7vw, 52px) !important;
        line-height: 1.05 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
        margin: 0 0 10px 0 !important;
        display: block !important;
      }
      .claude-hero-sub {
        font-family: 'Inter', sans-serif !important;
        font-size: 14px !important;
        color: var(--claude-muted) !important;
        line-height: 1.5 !important;
        display: block !important;
        margin: 0 !important;
      }
      .claude-accent { color: var(--claude-primary) !important; }

      /* ── Section titles ── */
      .claude-section-title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
        font-size: 26px !important;
        letter-spacing: -0.01em !important;
        color: var(--claude-cream) !important;
        margin: 16px 4px 8px !important;
        display: block !important;
      }

      /* ── Stat cards ── */
      .claude-label {
        font-size: 11px !important;
        font-weight: 500 !important;
        letter-spacing: 0.08em !important;
        text-transform: uppercase !important;
        color: var(--claude-muted) !important;
        margin: 0 0 10px 0 !important;
        display: block !important;
      }
      .claude-figure {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 32px !important;
        font-weight: 400 !important;
        line-height: 1 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
      }
      .claude-figure-small {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 22px !important;
        font-weight: 400 !important;
        line-height: 1 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
      }
      .claude-unit {
        font-size: 13px !important;
        color: var(--claude-muted) !important;
        margin-left: 4px !important;
      }
      .claude-delta {
        font-size: 12px !important;
        color: var(--claude-primary) !important;
        margin-top: 6px !important;
        display: block !important;
      }
      .claude-delta-muted { color: var(--claude-muted) !important; }
      .claude-delta-cream { color: var(--claude-cream-dim) !important; }

      /* ── Person row ── */
      .claude-persons {
        display: grid !important;
        grid-template-columns: 1fr 1fr 1fr !important;
        gap: 10px !important;
      }
      .claude-person {
        background: var(--claude-surface) !important;
        border: 1px solid var(--claude-border) !important;
        border-radius: 16px !important;
        padding: 18px 12px !important;
        text-align: center !important;
      }
      .claude-avatar {
        width: 56px !important;
        height: 56px !important;
        border-radius: 50% !important;
        margin: 0 auto 10px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 22px !important;
        font-weight: 400 !important;
        color: #F0EEE6 !important;
      }
      .claude-avatar-cj { background: linear-gradient(135deg, #C96342, #A84F32) !important; }
      .claude-avatar-mj { background: linear-gradient(135deg, #7BA7C9, #4A6E8A) !important; }
      .claude-avatar-ej { background: linear-gradient(135deg, #7FB069, #4A7B4A) !important; }
      .claude-name {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 16px !important;
        color: var(--claude-cream) !important;
        display: block !important;
      }
      .claude-state {
        font-size: 11px !important;
        color: var(--claude-muted) !important;
        margin-top: 2px !important;
        display: block !important;
      }

      /* ── Alert ── */
      .claude-alert-title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 22px !important;
        font-weight: 400 !important;
        color: var(--claude-cream) !important;
        display: block !important;
        margin-bottom: 4px !important;
      }
      .claude-alert-body {
        font-size: 13px !important;
        color: var(--claude-cream-dim) !important;
        display: block !important;
      }
