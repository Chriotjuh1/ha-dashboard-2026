################################################################################
# Thuis App — full-screen wrapper voor de standalone webapp
# Eén panel-view met een iframe naar /local/dashboard/
#
# Layout-recept:
#   - height: 100% (i.p.v. 100dvh) zodat de iframe exact het zichtbare
#     panel-gebied vult, ongeacht HA app-chrome of adresbalk-collapse.
#   - overflow: hidden op alle wrappers — body inside iframe heeft eigen
#     overflow:hidden, dus alleen .app scrollt. De fixed tabbar blijft
#     altijd zichtbaar omdat geen enkele wrapper kan scrollen.
################################################################################

title: Thuis
views:
  - title: Thuis
    path: app
    icon: mdi:hexagon-multiple
    panel: true
    cards:
      - type: iframe
        url: /local/dashboard/index.html?v=35
        aspect_ratio: '0'
        card_mod:
          style: |
            ha-card {
              background: var(--claude-bg, #262624) !important;
              border: none !important;
              box-shadow: none !important;
              padding: 0 !important;
              margin: 0 !important;
              border-radius: 0 !important;
              height: 100% !important;
              overflow: hidden !important;
            }
            ha-card > div {
              padding: 0 !important;
              margin: 0 !important;
              height: 100% !important;
              overflow: hidden !important;
            }
            iframe {
              display: block !important;
              width: 100% !important;
              height: 100% !important;
              border: none !important;
              background: var(--claude-bg, #262624) !important;
            }
