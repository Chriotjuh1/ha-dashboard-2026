################################################################################
# Thuis App — full-screen wrapper voor de standalone webapp
# Eén panel-view met een iframe naar /local/dashboard/
#
# Scroll-fix recept:
#   1. 100dvh (dynamic viewport) i.p.v. 100vh — handelt iOS adresbalk-collapse
#   2. -webkit-overflow-scrolling: touch op iframe PARENT (ha-card > div),
#      niet op iframe zelf — iOS Safari quirk
#   3. Geen position: absolute / overflow: hidden op de wrapper, anders
#      blokkeert iOS Safari de iframe-content scroll
################################################################################

title: Thuis
views:
  - title: Thuis
    path: app
    icon: mdi:hexagon-multiple
    panel: true
    cards:
      - type: iframe
        url: /local/dashboard/index.html
        aspect_ratio: '0'
        card_mod:
          style: |
            ha-card {
              background: var(--claude-bg, #262624) !important;
              border: none !important;
              box-shadow: none !important;
              padding: 0 !important;
              margin: 0 !important;
              border-radius: 0 !important;
              height: 100dvh !important;
              overflow: hidden !important;
            }
            /* Iframe parent: krijgt -webkit-overflow-scrolling om iOS
               iframe-content-scroll bug te omzeilen */
            ha-card > div {
              padding: 0 !important;
              margin: 0 !important;
              height: 100dvh !important;
              overflow: auto !important;
              -webkit-overflow-scrolling: touch !important;
            }
            iframe {
              display: block !important;
              width: 100% !important;
              height: 100dvh !important;
              border: none !important;
              background: var(--claude-bg, #262624) !important;
            }
