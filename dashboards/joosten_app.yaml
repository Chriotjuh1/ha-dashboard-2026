################################################################################
# Thuis App — full-screen wrapper voor de standalone webapp
# Eén panel-view met een iframe naar /local/dashboard/
# Wanneer je de HA Companion app op je telefoon opent en dit dashboard als
# standaard hebt ingesteld, krijg je de webapp full-screen te zien.
################################################################################

title: Thuis
views:
  - title: Thuis
    path: app
    icon: mdi:hexagon-multiple
    panel: true
    cards:
      - type: iframe
        url: /local/dashboard/index.html
        aspect_ratio: '0'
        card_mod:
          style: |
            ha-card {
              background: var(--claude-bg) !important;
              border: none !important;
              box-shadow: none !important;
              padding: 0 !important;
              margin: 0 !important;
              border-radius: 0 !important;
              height: 100vh !important;
            }
            /* Niet 'overflow: hidden' — dat blokkeert iframe scroll
               op iOS. Wel positie resetten om HA's padding-bottom
               wrapper te ontkrachten. */
            ha-card > * {
              padding-bottom: 0 !important;
              height: 100vh !important;
              position: relative !important;
            }
            iframe {
              position: absolute !important;
              inset: 0 !important;
              width: 100% !important;
              height: 100% !important;
              border: none !important;
              background: var(--claude-bg) !important;
              -webkit-overflow-scrolling: touch !important;
            }
