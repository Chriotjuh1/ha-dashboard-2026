################################################################################
# Claude Dashboard — class-based styling via theme card-mod-card-yaml
# Inline styles worden door HA's markdown sanitizer gestript, maar
# class-namen blijven behouden. De .claude-* classes zijn gedefinieerd
# in themes/claude_dark.yaml en worden via shadow-piercing toegepast.
################################################################################

title: Claude

# Reusable anchors
ghost_card: &ghost_card
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      ha-markdown { padding: 0 !important; }

surface_card: &surface_card
  card_mod:
    style: |
      ha-card {
        background: var(--claude-surface) !important;
        border: 1px solid var(--claude-border) !important;
        border-radius: 16px !important;
        box-shadow: none !important;
        padding: 16px !important;
        transition: border-color 200ms ease;
      }
      ha-card:hover { border-color: var(--claude-border-hover) !important; }
      ha-markdown { padding: 0 !important; }

alert_card: &alert_card
  card_mod:
    style: |
      ha-card {
        background: linear-gradient(135deg, rgba(201,99,66,0.18), rgba(201,99,66,0.04)) !important;
        border: 1px solid var(--claude-primary) !important;
        border-radius: 16px !important;
        box-shadow: none !important;
        padding: 16px 18px !important;
      }
      ha-markdown { padding: 0 !important; }

# Bottom nav button styles
nav_active: &nav_active
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 6px 4px !important; }
      mushroom-shape-icon { --shape-color: transparent !important; --icon-color: var(--claude-primary) !important; --icon-size: 26px !important; }
      .container { padding: 0 !important; }
      mushroom-state-info { text-align: center !important; }
      .container .primary { color: var(--claude-primary) !important; font-size: 10px !important; font-weight: 500 !important; line-height: 1.2 !important; }

nav_inactive: &nav_inactive
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 6px 4px !important; }
      mushroom-shape-icon { --shape-color: transparent !important; --icon-color: var(--claude-muted) !important; --icon-size: 26px !important; }
      .container { padding: 0 !important; }
      mushroom-state-info { text-align: center !important; }
      .container .primary { color: var(--claude-muted) !important; font-size: 10px !important; font-weight: 500 !important; line-height: 1.2 !important; }

nav_wrapper: &nav_wrapper
  card_mod:
    style: |
      :host {
        display: block;
        margin-top: 24px;
        background: rgba(31, 30, 28, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--claude-border);
        border-radius: 22px;
        padding: 4px 6px;
      }
      @media (max-width: 870px) {
        :host {
          position: fixed !important;
          bottom: 12px !important;
          left: 12px !important;
          right: 12px !important;
          z-index: 999 !important;
          margin-top: 0 !important;
        }
      }

views:

  # ───────────────────────────────────────────────────────────────────────
  # 1. START
  # ───────────────────────────────────────────────────────────────────────
  - title: Start
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <span class="claude-hero-title">{% set h = now().hour %}{% if h < 6 %}Goedenacht{% elif h < 12 %}Goedemorgen{% elif h < 18 %}Goedemiddag{% else %}Goedenavond{% endif %}, Chris.</span>
              <span class="claude-hero-sub">{{ now().strftime('%A %-d %B') }} · <span class="claude-accent">{{ states('weather.forecast_home') }}</span> · {{ state_attr('weather.forecast_home','temperature') }}°C</span>

      # Persons (initiaal-cirkels via classes)
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div class="claude-persons">
                <div class="claude-person">
                  <div class="claude-avatar claude-avatar-cj">CJ</div>
                  <span class="claude-name">Chris</span>
                  <span class="claude-state">{% if is_state('person.chris_joosten','home') %}Thuis{% elif is_state('person.chris_joosten','not_home') %}Onderweg{% else %}{{ states('person.chris_joosten') }}{% endif %}</span>
                </div>
                <div class="claude-person">
                  <div class="claude-avatar claude-avatar-mj">MJ</div>
                  <span class="claude-name">Marion</span>
                  <span class="claude-state">{% if is_state('person.marion_joosten','home') %}Thuis{% elif is_state('person.marion_joosten','not_home') %}Onderweg{% else %}{{ states('person.marion_joosten') }}{% endif %}</span>
                </div>
                <div class="claude-person">
                  <div class="claude-avatar claude-avatar-ej">EJ</div>
                  <span class="claude-name">Edwin</span>
                  <span class="claude-state">{% if is_state('person.edwin_joosten','home') %}Thuis{% elif is_state('person.edwin_joosten','not_home') %}Onderweg{% else %}{{ states('person.edwin_joosten') }}{% endif %}</span>
                </div>
              </div>

      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-section-title">Vandaag</span>'

      # 4 stat cards
      - type: grid
        column_span: 4
        cards:
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Zon</span>
              <span class="claude-figure">{{ states('sensor.sma_dagopbrengst') }}</span><span class="claude-unit">kWh</span>
              <span class="claude-delta">{{ states('sensor.zonnepanelen_vermogen') }} W nu</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Buiten</span>
              <span class="claude-figure">{{ state_attr('weather.forecast_home','temperature') }}</span><span class="claude-unit">°C</span>
              <span class="claude-delta">{{ states('weather.forecast_home') }}</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Volgend afval</span>
              <span class="claude-figure-small">PMD</span>
              <span class="claude-delta claude-delta-cream">{{ states('sensor.pmd') }}</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Lampen</span>
              <span class="claude-figure">{{ expand('switch.woonkamerlamp','switch.overkappinglamp','switch.opritlamp','switch.spotjes_overkapping') | selectattr('state','eq','on') | list | count }}</span><span class="claude-unit">/4 aan</span>
              <span class="claude-delta claude-delta-muted">4 schakelaars</span>

      # Verlichting
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-section-title">Verlichting</span>'
          - type: tile
            entity: switch.woonkamerlamp
            name: Woonkamer
            icon: mdi:sofa-outline
          - type: tile
            entity: switch.overkappinglamp
            name: Overkapping
            icon: mdi:lamps-outline
          - type: tile
            entity: switch.opritlamp
            name: Oprit
            icon: mdi:car-outline
          - type: tile
            entity: switch.spotjes_overkapping
            name: Spotjes
            icon: mdi:track-light

      # Bottom nav (Start active)
      - type: grid
        column_span: 4
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/benzine }

  # ───────────────────────────────────────────────────────────────────────
  # 2. ZONNEPANELEN
  # ───────────────────────────────────────────────────────────────────────
  - title: Zonnepanelen
    path: zonnepanelen
    icon: mdi:weather-sunny
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <span class="claude-hero-title">Zonnepanelen</span>
              <span class="claude-hero-sub">Status <span class="claude-accent">{{ states('sensor.zonnepanelen_status') }}</span> · limiet <span class="claude-accent">{{ states('sensor.zonnepanelen_limiet_percentage') }}%</span></span>

      - type: grid
        column_span: 4
        cards:
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Nu</span>
              <span class="claude-figure">{{ states('sensor.zonnepanelen_vermogen') }}</span><span class="claude-unit">W</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Vandaag</span>
              <span class="claude-figure">{{ states('sensor.sma_dagopbrengst') }}</span><span class="claude-unit">kWh</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Totaal</span>
              <span class="claude-figure">{{ states('sensor.sma_totale_opbrengst') }}</span><span class="claude-unit">kWh</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Limiet</span>
              <span class="claude-figure">{{ states('sensor.zonnepanelen_limiet_percentage') }}</span><span class="claude-unit">%</span>

      - type: grid
        column_span: 2
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-label">Vermogen</span>'
          - type: gauge
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            min: 0
            max: 6000
            needle: true
            severity: { red: 0, yellow: 100, green: 1000 }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; padding: 16px !important; box-shadow: none !important; }

      - type: grid
        column_span: 2
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-label">Verloop vandaag</span>'
          - type: custom:mini-graph-card
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            hours_to_show: 24
            points_per_hour: 6
            line_width: 2
            line_color: '#C96342'
            smoothing: true
            show: { fill: fade, extrema: true, labels: true, name: false }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; padding: 12px !important; box-shadow: none !important; }

      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-section-title">Limiet</span>'
          - type: button
            name: 100%
            icon: mdi:weather-sunny
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_aanzetten, confirmation: { text: 'Op 100% zetten?' } }
            card_mod:
              style: |
                ha-card { background: var(--claude-primary) !important; border: 1px solid var(--claude-primary) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 16px !important; color: var(--claude-cream) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-cream) !important; }
          - type: button
            name: 50%
            icon: mdi:circle-half-full
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_50_procent, confirmation: { text: 'Op 50% zetten?' } }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border-hover) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 16px !important; color: var(--claude-cream) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-primary-soft) !important; }
          - type: button
            name: Uit
            icon: mdi:power
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_uitschakelen, confirmation: { text: 'Volledig uit?' } }
            card_mod:
              style: |
                ha-card { background: transparent !important; border: 1px solid var(--claude-border-hover) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 16px !important; color: var(--claude-cream-dim) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-muted) !important; }

      - type: grid
        column_span: 4
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/benzine }

  # ───────────────────────────────────────────────────────────────────────
  # 3. TV & KLIMAAT (lampen)
  # ───────────────────────────────────────────────────────────────────────
  - title: TV & Klimaat
    path: tv-klimaat
    icon: mdi:lightbulb-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <span class="claude-hero-title">Verlichting & schema's</span>
              <span class="claude-hero-sub">Schakel handmatig of laat ze op tijd draaien.</span>

      - type: grid
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-label">Lampen</span>'
          - type: tile
            entity: switch.woonkamerlamp
            name: Woonkamer
            icon: mdi:sofa-outline
          - type: tile
            entity: switch.overkappinglamp
            name: Overkapping
            icon: mdi:lamps-outline
          - type: tile
            entity: switch.opritlamp
            name: Oprit
            icon: mdi:car-outline
          - type: tile
            entity: switch.spotjes_overkapping
            name: Spotjes overkapping
            icon: mdi:track-light

      - type: grid
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-label">Woonkamer schema</span>'
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_datetime.woonkamerlamp_on_time
                name: Aan om
              - entity: input_datetime.woonkamerlamp_off_time
                name: Uit om
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; box-shadow: none !important; padding: 4px 8px !important; }

      - type: grid
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<span class="claude-label">Buitenlampen schema</span>'
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_datetime.buitenlampen_on_time
                name: Aan om
              - entity: input_datetime.buitenlampen_off_time
                name: Uit om
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; box-shadow: none !important; padding: 4px 8px !important; }

      - type: grid
        column_span: 3
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/benzine }

  # ───────────────────────────────────────────────────────────────────────
  # 4. AFVAL
  # ───────────────────────────────────────────────────────────────────────
  - title: Afval
    path: afval
    icon: mdi:recycle
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <span class="claude-hero-title">Afvalkalender</span>
              <span class="claude-hero-sub">Volgende ophaaldagen volgens de gemeentekalender.</span>

      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - { condition: state, entity: sensor.pmd, state: Morgen }
                  - { condition: state, entity: sensor.restafval, state: Morgen }
                  - { condition: state, entity: sensor.papier, state: Morgen }
            card:
              <<: *alert_card
              type: markdown
              content: |
                <span class="claude-alert-title">✱ Morgen buitenzetten</span>
                <span class="claude-alert-body">{% if is_state('sensor.pmd','Morgen') %}PMD{% endif %}{% if is_state('sensor.restafval','Morgen') %}{% if is_state('sensor.pmd','Morgen') %} · {% endif %}Restafval{% endif %}{% if is_state('sensor.papier','Morgen') %}{% if is_state('sensor.pmd','Morgen') or is_state('sensor.restafval','Morgen') %} · {% endif %}Papier{% endif %}</span>

      - type: grid
        column_span: 3
        cards:
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">PMD</span>
              <span class="claude-figure-small">{{ states('sensor.pmd') }}</span>
              <span class="claude-delta">Plastic, metaal &amp; drinkpakken</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Restafval</span>
              <span class="claude-figure-small">{{ states('sensor.restafval') }}</span>
              <span class="claude-delta">Niet recyclebaar</span>
          - <<: *surface_card
            type: markdown
            content: |
              <span class="claude-label">Papier</span>
              <span class="claude-figure-small">{{ states('sensor.papier') }}</span>
              <span class="claude-delta">Karton &amp; papier</span>

      - type: grid
        column_span: 3
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
