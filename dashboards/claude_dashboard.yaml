    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *hero_style
            type: markdown
            content: |
              # Brandstofprijzen
              <p>Live prijzen van Euro 95 (E10) bij grenstankstations in <span class="accent">Duitsland</span> en <span class="accent">België</span>.</p>

      # Duitsland
