################################################################################
# Claude Dashboard — mushroom-only approach
# Geen markdown-cards meer voor styled text (HA strijpt te veel weg).
# Alles via mushroom-title-card en mushroom-template-card waar card-mod
# rechtstreeks de .title/.subtitle/.primary/.secondary kan stylen.
################################################################################

title: Claude

# ════════════════════════════════════════════════════════════════════════════
# Reusable card_mod blokken
# ════════════════════════════════════════════════════════════════════════════

# Hero (mushroom-title-card)
hero_mod: &hero_mod
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 16px 4px 12px !important;
      }
      .header { padding: 0 !important; gap: 4px !important; }
      .title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
        font-size: clamp(34px, 6vw, 52px) !important;
        line-height: 1.05 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
        margin: 0 !important;
      }
      .subtitle {
        font-family: 'Inter', sans-serif !important;
        font-size: 14px !important;
        font-weight: 400 !important;
        color: var(--claude-muted) !important;
        line-height: 1.5 !important;
        margin: 0 !important;
      }

# Section title (kleinere mushroom-title-card)
section_mod: &section_mod
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 12px 4px 4px !important;
      }
      .header { padding: 0 !important; }
      .title {
        font-family: 'Fraunces', Georgia, serif !important;
        font-weight: 400 !important;
        font-size: 26px !important;
        letter-spacing: -0.01em !important;
        color: var(--claude-cream) !important;
        margin: 0 !important;
      }

# Stat card (label boven, big figure onder, via flex column-reverse)
stat_mod: &stat_mod
  card_mod:
    style: |
      ha-card {
        background: var(--claude-surface) !important;
        border: 1px solid var(--claude-border) !important;
        border-radius: 16px !important;
        box-shadow: none !important;
        padding: 18px 18px 16px !important;
        transition: border-color 200ms ease;
      }
      ha-card:hover { border-color: var(--claude-border-hover) !important; }
      mushroom-shape-icon { display: none !important; }
      mushroom-state-info { padding-left: 0 !important; width: 100% !important; }
      mushroom-state-info > div {
        display: flex !important;
        flex-direction: column-reverse !important;
        gap: 8px !important;
      }
      .container .primary {
        font-family: 'Fraunces', Georgia, serif !important;
        font-size: 30px !important;
        font-weight: 400 !important;
        line-height: 1 !important;
        letter-spacing: -0.02em !important;
        color: var(--claude-cream) !important;
        white-space: normal !important;
      }
      .container .secondary {
        font-size: 11px !important;
        font-weight: 500 !important;
        letter-spacing: 0.08em !important;
        text-transform: uppercase !important;
        color: var(--claude-muted) !important;
        white-space: normal !important;
      }

# Person card variants (different gradient per person)
person_cj: &person_cj
  card_mod:
    style:
      .: |
        ha-card {
          background: var(--claude-surface) !important;
          border: 1px solid var(--claude-border) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
          padding: 18px 12px !important;
        }
        mushroom-state-info { text-align: center !important; }
        .container .primary {
          font-family: 'Fraunces', Georgia, serif !important;
          font-weight: 400 !important;
          font-size: 16px !important;
          color: var(--claude-cream) !important;
        }
        .container .secondary {
          font-size: 11px !important;
          color: var(--claude-muted) !important;
        }
      mushroom-shape-icon$: |
        .shape {
          background: linear-gradient(135deg, #C96342, #A84F32) !important;
          position: relative !important;
        }
        .shape::after {
          content: 'CJ';
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Fraunces', Georgia, serif;
          font-size: 22px;
          color: #F0EEE6;
        }
        ha-state-icon, ha-icon { opacity: 0 !important; }

person_mj: &person_mj
  card_mod:
    style:
      .: |
        ha-card {
          background: var(--claude-surface) !important;
          border: 1px solid var(--claude-border) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
          padding: 18px 12px !important;
        }
        mushroom-state-info { text-align: center !important; }
        .container .primary {
          font-family: 'Fraunces', Georgia, serif !important;
          font-weight: 400 !important;
          font-size: 16px !important;
          color: var(--claude-cream) !important;
        }
        .container .secondary {
          font-size: 11px !important;
          color: var(--claude-muted) !important;
        }
      mushroom-shape-icon$: |
        .shape {
          background: linear-gradient(135deg, #7BA7C9, #4A6E8A) !important;
          position: relative !important;
        }
        .shape::after {
          content: 'MJ';
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Fraunces', Georgia, serif;
          font-size: 22px;
          color: #F0EEE6;
        }
        ha-state-icon, ha-icon { opacity: 0 !important; }

person_ej: &person_ej
  card_mod:
    style:
      .: |
        ha-card {
          background: var(--claude-surface) !important;
          border: 1px solid var(--claude-border) !important;
          border-radius: 16px !important;
          box-shadow: none !important;
          padding: 18px 12px !important;
        }
        mushroom-state-info { text-align: center !important; }
        .container .primary {
          font-family: 'Fraunces', Georgia, serif !important;
          font-weight: 400 !important;
          font-size: 16px !important;
          color: var(--claude-cream) !important;
        }
        .container .secondary {
          font-size: 11px !important;
          color: var(--claude-muted) !important;
        }
      mushroom-shape-icon$: |
        .shape {
          background: linear-gradient(135deg, #7FB069, #4A7B4A) !important;
          position: relative !important;
        }
        .shape::after {
          content: 'EJ';
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Fraunces', Georgia, serif;
          font-size: 22px;
          color: #F0EEE6;
        }
        ha-state-icon, ha-icon { opacity: 0 !important; }

# Bottom nav buttons
nav_active: &nav_active
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 6px 4px !important; }
      mushroom-shape-icon { --shape-color: transparent !important; --icon-color: var(--claude-primary) !important; --icon-size: 26px !important; }
      mushroom-state-info { text-align: center !important; }
      .container .primary { color: var(--claude-primary) !important; font-size: 10px !important; font-weight: 500 !important; line-height: 1.2 !important; }

nav_inactive: &nav_inactive
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 6px 4px !important; }
      mushroom-shape-icon { --shape-color: transparent !important; --icon-color: var(--claude-muted) !important; --icon-size: 26px !important; }
      mushroom-state-info { text-align: center !important; }
      .container .primary { color: var(--claude-muted) !important; font-size: 10px !important; font-weight: 500 !important; line-height: 1.2 !important; }

nav_wrapper: &nav_wrapper
  card_mod:
    style: |
      :host {
        display: block;
        margin-top: 24px;
        background: rgba(31, 30, 28, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--claude-border);
        border-radius: 22px;
        padding: 4px 6px;
      }
      @media (max-width: 870px) {
        :host {
          position: fixed !important;
          bottom: 12px !important;
          left: 12px !important;
          right: 12px !important;
          z-index: 999 !important;
          margin-top: 0 !important;
        }
      }

views:

  # ───────────────────────────────────────────────────────────────────────
  # 1. START
  # ───────────────────────────────────────────────────────────────────────
  - title: Start
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 4
        cards:
          - <<: *hero_mod
            type: custom:mushroom-title-card
            title: |
              {% set h = now().hour %}{% if h < 6 %}Goedenacht{% elif h < 12 %}Goedemorgen{% elif h < 18 %}Goedemiddag{% else %}Goedenavond{% endif %}, Chris.
            subtitle: >
              {{ now().strftime('%A %-d %B') }} · {{ states('weather.forecast_home') }} · {{ state_attr('weather.forecast_home','temperature') }}°C

      # Persons
      - type: grid
        column_span: 4
        cards:
          - type: horizontal-stack
            cards:
              - <<: *person_cj
                type: custom:mushroom-template-card
                primary: Chris
                secondary: |
                  {% if is_state('person.chris_joosten','home') %}Thuis{% elif is_state('person.chris_joosten','not_home') %}Onderweg{% else %}{{ states('person.chris_joosten') }}{% endif %}
                icon: mdi:account
                layout: vertical
                fill_container: true
                tap_action: { action: more-info, entity: person.chris_joosten }
              - <<: *person_mj
                type: custom:mushroom-template-card
                primary: Marion
                secondary: |
                  {% if is_state('person.marion_joosten','home') %}Thuis{% elif is_state('person.marion_joosten','not_home') %}Onderweg{% else %}{{ states('person.marion_joosten') }}{% endif %}
                icon: mdi:account
                layout: vertical
                fill_container: true
                tap_action: { action: more-info, entity: person.marion_joosten }
              - <<: *person_ej
                type: custom:mushroom-template-card
                primary: Edwin
                secondary: |
                  {% if is_state('person.edwin_joosten','home') %}Thuis{% elif is_state('person.edwin_joosten','not_home') %}Onderweg{% else %}{{ states('person.edwin_joosten') }}{% endif %}
                icon: mdi:account
                layout: vertical
                fill_container: true
                tap_action: { action: more-info, entity: person.edwin_joosten }

      - type: grid
        column_span: 4
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Vandaag

      - type: grid
        column_span: 4
        cards:
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ states('sensor.sma_dagopbrengst') }} kWh"
            secondary: Zon
            icon: ''
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ state_attr('weather.forecast_home','temperature') }}°C"
            secondary: Buiten
            icon: ''
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ states('sensor.pmd') }}"
            secondary: Volgend afval (PMD)
            icon: ''
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ expand('switch.woonkamerlamp','switch.overkappinglamp','switch.opritlamp','switch.spotjes_overkapping') | selectattr('state','eq','on') | list | count }}/4 aan"
            secondary: Lampen
            icon: ''

      - type: grid
        column_span: 4
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Verlichting
          - type: tile
            entity: switch.woonkamerlamp
            name: Woonkamer
            icon: mdi:sofa-outline
          - type: tile
            entity: switch.overkappinglamp
            name: Overkapping
            icon: mdi:lamps-outline
          - type: tile
            entity: switch.opritlamp
            name: Oprit
            icon: mdi:car-outline
          - type: tile
            entity: switch.spotjes_overkapping
            name: Spotjes
            icon: mdi:track-light

      # Bottom nav
      - type: grid
        column_span: 4
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/benzine }

  # ───────────────────────────────────────────────────────────────────────
  # 2. ZONNEPANELEN
  # ───────────────────────────────────────────────────────────────────────
  - title: Zonnepanelen
    path: zonnepanelen
    icon: mdi:weather-sunny
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - <<: *hero_mod
            type: custom:mushroom-title-card
            title: Zonnepanelen
            subtitle: >
              Status {{ states('sensor.zonnepanelen_status') }} · limiet {{ states('sensor.zonnepanelen_limiet_percentage') }}%

      - type: grid
        column_span: 4
        cards:
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ states('sensor.zonnepanelen_vermogen') }} W"
            secondary: Nu
            icon: ''
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ states('sensor.sma_dagopbrengst') }} kWh"
            secondary: Vandaag
            icon: ''
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ states('sensor.sma_totale_opbrengst') }} kWh"
            secondary: Totaal
            icon: ''
          - <<: *stat_mod
            type: custom:mushroom-template-card
            primary: "{{ states('sensor.zonnepanelen_limiet_percentage') }} %"
            secondary: Limiet
            icon: ''

      - type: grid
        column_span: 2
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Vermogen
          - type: gauge
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            min: 0
            max: 6000
            needle: true
            severity: { red: 0, yellow: 100, green: 1000 }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; padding: 16px !important; box-shadow: none !important; }

      - type: grid
        column_span: 2
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Verloop vandaag
          - type: custom:mini-graph-card
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            hours_to_show: 24
            points_per_hour: 6
            line_width: 2
            line_color: '#C96342'
            smoothing: true
            show: { fill: fade, extrema: true, labels: true, name: false }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; padding: 12px !important; box-shadow: none !important; }

      - type: grid
        column_span: 4
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Limiet
          - type: button
            name: 100%
            icon: mdi:weather-sunny
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_aanzetten, confirmation: { text: 'Op 100% zetten?' } }
            card_mod:
              style: |
                ha-card { background: var(--claude-primary) !important; border: 1px solid var(--claude-primary) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 16px !important; color: var(--claude-cream) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-cream) !important; }
          - type: button
            name: 50%
            icon: mdi:circle-half-full
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_50_procent, confirmation: { text: 'Op 50% zetten?' } }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border-hover) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 16px !important; color: var(--claude-cream) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-primary-soft) !important; }
          - type: button
            name: Uit
            icon: mdi:power
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_uitschakelen, confirmation: { text: 'Volledig uit?' } }
            card_mod:
              style: |
                ha-card { background: transparent !important; border: 1px solid var(--claude-border-hover) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 16px !important; color: var(--claude-cream-dim) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-muted) !important; }

      - type: grid
        column_span: 4
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
                layout: vertical
                tap_action: { action: navigate, navigation_path: /claude-dashboard/benzine }

  # ───────────────────────────────────────────────────────────────────────
  # 3. TV & KLIMAAT
  # ───────────────────────────────────────────────────────────────────────
  - title: TV & Klimaat
    path: tv-klimaat
    icon: mdi:lightbulb-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *hero_mod
            type: custom:mushroom-title-card
            title: Verlichting & schema's
            subtitle: Schakel handmatig of laat ze op tijd draaien.

      - type: grid
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Lampen
          - type: tile
            entity: switch.woonkamerlamp
            name: Woonkamer
            icon: mdi:sofa-outline
          - type: tile
            entity: switch.overkappinglamp
            name: Overkapping
            icon: mdi:lamps-outline
          - type: tile
            entity: switch.opritlamp
            name: Oprit
            icon: mdi:car-outline
          - type: tile
            entity: switch.spotjes_overkapping
            name: Spotjes overkapping
            icon: mdi:track-light

      - type: grid
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Woonkamer schema
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_datetime.woonkamerlamp_on_time
                name: Aan om
              - entity: input_datetime.woonkamerlamp_off_time
                name: Uit om
            card_mod: &time_entities_mod
              style:
                .: |
                  ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; box-shadow: none !important; padding: 4px 8px !important; }
                hui-input-datetime-entity-row$ ha-time-input $: |
                  ha-textfield {
                    --mdc-text-field-fill-color: #3A3936 !important;
                    --mdc-text-field-ink-color: #F0EEE6 !important;
                    --mdc-text-field-label-ink-color: #A8A29E !important;
                    --mdc-text-field-idle-line-color: rgba(240,238,230,0.18) !important;
                    --mdc-text-field-hover-line-color: #D97757 !important;
                    --mdc-text-field-focused-label-color: #D97757 !important;
                  }
                hui-input-datetime-entity-row$ ha-time-input$ ha-textfield$: |
                  :host {
                    --mdc-text-field-fill-color: #3A3936 !important;
                    --mdc-text-field-ink-color: #F0EEE6 !important;
                    --mdc-text-field-label-ink-color: #A8A29E !important;
                  }
                  .mdc-text-field,.mdc-text-field--filled {
                    background-color: #3A3936 !important;
                  }
                  .mdc-text-field__input,input {
                    color: #F0EEE6 !important;
                    caret-color: #F0EEE6 !important;
                    -webkit-text-fill-color: #F0EEE6 !important;
                  }
                  .mdc-floating-label,.mdc-floating-label--float-above {
                    color: #A8A29E !important;
                  }

      - type: grid
        cards:
          - <<: *section_mod
            type: custom:mushroom-title-card
            title: Buitenlampen schema
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_datetime.buitenlampen_on_time
                name: Aan om
              - entity: input_datetime.buitenlampen_off_time
                name: Uit om
            card_mod: *time_entities_mod

      - type: grid
