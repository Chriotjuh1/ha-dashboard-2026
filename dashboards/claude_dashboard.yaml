################################################################################
# Claude Dashboard — Home Assistant 2026
# Modern sections-view dashboard, dark Claude-themed
#
# Dependencies (HACS → Frontend):
#   - mushroom
#   - mini-graph-card
#   - bubble-card
#   - button-card
#
# Replace every "# CHANGEME:" entity with your own.
################################################################################

title: Claude
views:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. HOME — overzicht
  # ════════════════════════════════════════════════════════════════════════════
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 4
    sections:
      # ── Welkomstrij ────────────────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            content: >
              ## {% set h = now().hour %}{% if h < 6 %}Goedenacht{% elif h < 12
              %}Goedemorgen{% elif h < 18 %}Goedemiddag{% else %}Goedenavond{%
              endif %}, {{ user }}

              <span style="color: var(--claude-muted); font-size: 0.95em;">
              {{ now().strftime('%A %d %B') }} · {{
              states('sensor.weer_temperatuur') | default('—', true) }}°C ·
              {{ states('weather.thuis') | default('helder', true) }}
              </span>
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,
                    var(--claude-surface) 0%,
                    var(--claude-surface-2) 100%);
                  border: 1px solid rgba(217, 119, 87, 0.12);
                  padding: 8px 12px;
                }
                ha-card h2 { margin: 0 0 4px 0; font-weight: 500; }

      # ── Snelle scènes ─────────────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Scènes
            heading_style: subtitle
            icon: mdi:palette
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Ochtend
                secondary: 07:00
                icon: mdi:weather-sunset-up
                icon_color: amber
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.ochtend  # CHANGEME: scene
              - type: custom:mushroom-template-card
                primary: Avond
                secondary: warm
                icon: mdi:weather-sunset
                icon_color: deep-orange
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.avond  # CHANGEME: scene
              - type: custom:mushroom-template-card
                primary: Film
                secondary: dim
                icon: mdi:movie-open
                icon_color: red
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.film  # CHANGEME: scene
              - type: custom:mushroom-template-card
                primary: Nacht
                secondary: alles uit
                icon: mdi:weather-night
                icon_color: indigo
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.nacht  # CHANGEME: scene

      # ── Status chips ──────────────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Status
            heading_style: subtitle
            icon: mdi:information-outline
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:lightbulb-group
                icon_color: amber
                content: >
                  {{ states.light | selectattr('state', 'eq', 'on') | list | count }}
                  aan
              - type: template
                icon: mdi:thermometer
                icon_color: deep-orange
                content: "{{ states('sensor.huiskamer_temperatuur') }}°C"  # CHANGEME: sensor
              - type: template
                icon: mdi:water-percent
                icon_color: blue
                content: "{{ states('sensor.huiskamer_vochtigheid') }}%"  # CHANGEME: sensor
              - type: template
                icon: mdi:shield-check
                icon_color: green
                content: "Veilig"
                tap_action:
                  action: navigate
                  navigation_path: /claude-dashboard/security
              - type: template
                icon: mdi:solar-power
                icon_color: yellow
                content: "{{ states('sensor.zonnepanelen_vermogen') }} W"  # CHANGEME: sensor

      # ── Favoriete kamers ──────────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Kamers
            heading_style: title
            icon: mdi:floor-plan
          - type: tile
            entity: light.woonkamer  # CHANGEME: light group
            name: Woonkamer
            icon: mdi:sofa
            features_position: bottom
            vertical: false
            features:
              - type: light-brightness
          - type: tile
            entity: light.keuken  # CHANGEME: light group
            name: Keuken
            icon: mdi:silverware-fork-knife
            features:
              - type: light-brightness
          - type: tile
            entity: light.slaapkamer  # CHANGEME: light group
            name: Slaapkamer
            icon: mdi:bed
            features:
              - type: light-brightness
          - type: tile
            entity: light.badkamer  # CHANGEME: light group
            name: Badkamer
            icon: mdi:shower
            features:
              - type: light-brightness

  # ════════════════════════════════════════════════════════════════════════════
  # 2. VERLICHTING
  # ════════════════════════════════════════════════════════════════════════════
  - title: Verlichting
    path: lights
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Beneden
            icon: mdi:home-floor-1
          - type: custom:mushroom-light-card
            entity: light.woonkamer  # CHANGEME
            name: Woonkamer
            show_brightness_control: true
            show_color_control: true
            show_color_temp_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.keuken  # CHANGEME
            name: Keuken
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.eettafel  # CHANGEME
            name: Eettafel
            show_brightness_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.gang  # CHANGEME
            name: Gang
            show_brightness_control: true
            collapsible_controls: true

      - type: grid
        cards:
          - type: heading
            heading: Boven
            icon: mdi:home-floor-2
          - type: custom:mushroom-light-card
            entity: light.slaapkamer  # CHANGEME
            name: Slaapkamer
            show_brightness_control: true
            show_color_temp_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.badkamer  # CHANGEME
            name: Badkamer
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.werkkamer  # CHANGEME
            name: Werkkamer
            show_brightness_control: true
            show_color_temp_control: true
            collapsible_controls: true

      - type: grid
        cards:
          - type: heading
            heading: Buiten
            icon: mdi:tree
          - type: custom:mushroom-light-card
            entity: light.tuin  # CHANGEME
            name: Tuin
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.terras  # CHANGEME
            name: Terras
            show_brightness_control: true
            show_color_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.voordeur  # CHANGEME
            name: Voordeur
            show_brightness_control: true
            collapsible_controls: true

  # ════════════════════════════════════════════════════════════════════════════
  # 3. KLIMAAT
  # ════════════════════════════════════════════════════════════════════════════
  - title: Klimaat
    path: climate
    icon: mdi:thermometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Thermostaat
            icon: mdi:thermostat
          - type: thermostat
            entity: climate.thuis  # CHANGEME: climate
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - heat
                  - cool
                  - auto
                  - 'off'
              - type: climate-preset-modes
                style: dropdown
                preset_modes:
                  - home
                  - away
                  - sleep
                  - eco

      - type: grid
        cards:
          - type: heading
            heading: Sensoren
            icon: mdi:radar
          - type: custom:mushroom-template-card
            primary: Woonkamer
            secondary: "{{ states('sensor.woonkamer_temperatuur') }}° · {{ states('sensor.woonkamer_vochtigheid') }}%"  # CHANGEME
            icon: mdi:sofa
            icon_color: deep-orange
          - type: custom:mushroom-template-card
            primary: Slaapkamer
            secondary: "{{ states('sensor.slaapkamer_temperatuur') }}° · {{ states('sensor.slaapkamer_vochtigheid') }}%"  # CHANGEME
            icon: mdi:bed
            icon_color: indigo
          - type: custom:mushroom-template-card
            primary: Badkamer
            secondary: "{{ states('sensor.badkamer_temperatuur') }}° · {{ states('sensor.badkamer_vochtigheid') }}%"  # CHANGEME
            icon: mdi:shower
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: Buiten
            secondary: "{{ states('sensor.buiten_temperatuur') }}° · {{ states('sensor.weer_conditie') }}"  # CHANGEME
            icon: mdi:weather-partly-cloudy
            icon_color: amber

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Verloop laatste 24 uur
            icon: mdi:chart-line
          - type: custom:mini-graph-card
            name: Temperatuur per kamer
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            smoothing: true
            entities:
              - entity: sensor.woonkamer_temperatuur  # CHANGEME
                name: Woonkamer
                color: "#D97757"
              - entity: sensor.slaapkamer_temperatuur  # CHANGEME
                name: Slaapkamer
                color: "#7BA7C9"
              - entity: sensor.buiten_temperatuur  # CHANGEME
                name: Buiten
                color: "#7FB069"
            show:
              labels: true
              labels_secondary: false
              extrema: true
              fill: fade

  # ════════════════════════════════════════════════════════════════════════════
  # 4. MEDIA
  # ════════════════════════════════════════════════════════════════════════════
  - title: Media
    path: media
    icon: mdi:music
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Speelt nu
            icon: mdi:play-circle
          - type: custom:mushroom-media-player-card
            entity: media_player.spotify  # CHANGEME
            use_media_info: true
            use_media_artwork: true
            show_volume_level: true
            volume_controls:
              - volume_mute
              - volume_set
              - volume_buttons
            media_controls:
              - on_off
              - shuffle
              - previous
              - play_pause_stop
              - next
              - repeat
            fill_container: true

      - type: grid
        cards:
          - type: heading
            heading: Speakers
            icon: mdi:speaker
          - type: custom:mushroom-media-player-card
            entity: media_player.woonkamer_speaker  # CHANGEME
            name: Woonkamer
            icon: mdi:speaker
            use_media_info: true
            volume_controls:
              - volume_set
            media_controls:
              - play_pause_stop
              - previous
              - next
            collapsible_controls: true
          - type: custom:mushroom-media-player-card
            entity: media_player.keuken_speaker  # CHANGEME
            name: Keuken
            icon: mdi:speaker
            use_media_info: true
            volume_controls:
              - volume_set
            media_controls:
              - play_pause_stop
            collapsible_controls: true
          - type: custom:mushroom-media-player-card
            entity: media_player.slaapkamer_speaker  # CHANGEME
            name: Slaapkamer
            icon: mdi:speaker
            use_media_info: true
            volume_controls:
              - volume_set
            media_controls:
              - play_pause_stop
            collapsible_controls: true

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: TV & sources
            icon: mdi:television
          - type: tile
            entity: media_player.tv  # CHANGEME
            name: Woonkamer TV
            icon: mdi:television-classic
            features:
              - type: media-player-volume-slider
              - type: media-player-playback
          - type: custom:mushroom-template-card
            primary: Netflix
            icon: mdi:netflix
            icon_color: red
            tap_action:
              action: call-service
              service: media_player.select_source
              target:
                entity_id: media_player.tv  # CHANGEME
              data:
                source: Netflix
          - type: custom:mushroom-template-card
            primary: YouTube
            icon: mdi:youtube
            icon_color: red
            tap_action:
              action: call-service
              service: media_player.select_source
              target:
                entity_id: media_player.tv  # CHANGEME
              data:
                source: YouTube
          - type: custom:mushroom-template-card
            primary: Spotify
            icon: mdi:spotify
            icon_color: green
            tap_action:
              action: call-service
              service: media_player.select_source
              target:
                entity_id: media_player.tv  # CHANGEME
              data:
                source: Spotify

  # ════════════════════════════════════════════════════════════════════════════
  # 5. ENERGIE & BEVEILIGING
  # ════════════════════════════════════════════════════════════════════════════
  - title: Energie & Beveiliging
    path: security
    icon: mdi:shield-home
    type: sections
    max_columns: 4
    sections:
      # ── Live energie ──────────────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live energie
            icon: mdi:flash
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Verbruik
                secondary: "{{ states('sensor.huidig_verbruik') }} W"  # CHANGEME
                icon: mdi:transmission-tower
                icon_color: |
                  {% set v = states('sensor.huidig_verbruik') | float(0) %}
                  {% if v > 3000 %}red{% elif v > 1500 %}orange{% else %}green{% endif %}
                fill_container: true
              - type: custom:mushroom-template-card
                primary: Zon
                secondary: "{{ states('sensor.zonnepanelen_vermogen') }} W"  # CHANGEME
                icon: mdi:solar-power-variant
                icon_color: amber
                fill_container: true
              - type: custom:mushroom-template-card
                primary: Accu
                secondary: "{{ states('sensor.accu_niveau') }}%"  # CHANGEME
                icon: mdi:battery-charging
                icon_color: deep-orange
                fill_container: true
          - type: custom:mini-graph-card
            name: Energie vandaag
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            aggregate_func: avg
            entities:
              - entity: sensor.huidig_verbruik  # CHANGEME
                name: Verbruik
                color: "#7BA7C9"
              - entity: sensor.zonnepanelen_vermogen  # CHANGEME
                name: Productie
                color: "#E8B86E"
            show:
              fill: fade
              extrema: true
              labels: true

      # ── Alarm + deuren ────────────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Beveiliging
            icon: mdi:shield-home-outline
          - type: tile
            entity: alarm_control_panel.huis  # CHANGEME
            name: Alarm
            icon: mdi:shield-lock
            features:
              - type: alarm-modes
                modes:
                  - armed_home
                  - armed_away
                  - armed_night
                  - disarmed
          - type: custom:mushroom-entity-card
            entity: lock.voordeur  # CHANGEME
            name: Voordeur
            icon: mdi:door
            icon_color: |
              {{ 'green' if is_state('lock.voordeur', 'locked') else 'red' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.achterdeur  # CHANGEME
            name: Achterdeur
            icon: mdi:door-closed
            icon_color: |
              {{ 'red' if is_state('binary_sensor.achterdeur', 'on') else 'green' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.garage  # CHANGEME
            name: Garage
            icon: mdi:garage
            icon_color: |
              {{ 'red' if is_state('binary_sensor.garage', 'on') else 'green' }}

      # ── Camera's ─────────────────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Camera's
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.voordeur  # CHANGEME
            name: Voordeur
            show_state: false
            show_name: true
            camera_view: live
          - type: picture-entity
            entity: camera.achtertuin  # CHANGEME
            name: Achtertuin
            show_state: false
            show_name: true
            camera_view: live
          - type: picture-entity
            entity: camera.oprit  # CHANGEME
            name: Oprit
            show_state: false
            show_name: true
            camera_view: live
          - type: picture-entity
            entity: camera.garage  # CHANGEME
            name: Garage
            show_state: false
            show_name: true
            camera_view: live

      # ── Zonnepanelen detail ──────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Zonnepanelen vandaag
            icon: mdi:solar-power
          - type: energy-distribution
            link_dashboard: true
