              <div class="delta">Goedkoopste in postcode 3640</div>
          - <<: *stat_style
            type: markdown
            content: |
              ### Binnen 5 km
              <span class="figure">{{ states('sensor.carbu_com_super95_3640_5km') }}</span><span class="unit">€/L</span>
