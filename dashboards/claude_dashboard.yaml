    icon: mdi:recycle
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div style="padding:16px 4px 12px;">
                <div style="font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:clamp(34px,7vw,52px); line-height:1.05; letter-spacing:-0.02em; color:var(--claude-cream); margin-bottom:10px;">Afvalkalender</div>
                <div style="font-family:'Inter',system-ui,sans-serif; font-size:14px; color:var(--claude-muted); line-height:1.5;">Volgende ophaaldagen volgens de gemeentekalender.</div>
              </div>

      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - { condition: state, entity: sensor.pmd, state: Morgen }
                  - { condition: state, entity: sensor.restafval, state: Morgen }
                  - { condition: state, entity: sensor.papier, state: Morgen }
            card:
              type: markdown
              content: |
                <div>
                  <div style="font-family:'Fraunces',Georgia,serif; font-size:22px; font-weight:400; color:var(--claude-cream); margin-bottom:4px;">✱ Morgen buitenzetten</div>
                  <div style="font-family:'Inter',sans-serif; font-size:13px; color:var(--claude-cream-dim);">{% if is_state('sensor.pmd','Morgen') %}PMD{% endif %}{% if is_state('sensor.restafval','Morgen') %}{% if is_state('sensor.pmd','Morgen') %} · {% endif %}Restafval{% endif %}{% if is_state('sensor.papier','Morgen') %}{% if is_state('sensor.pmd','Morgen') or is_state('sensor.restafval','Morgen') %} · {% endif %}Papier{% endif %}</div>
                </div>
              card_mod:
                style: |
                  ha-card { background: linear-gradient(135deg, rgba(201,99,66,0.18) 0%, rgba(201,99,66,0.04) 100%) !important; border: 1px solid var(--claude-primary) !important; border-radius: 16px !important; padding: 16px 18px !important; box-shadow: none !important; }
