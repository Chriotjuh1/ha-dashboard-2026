################################################################################
# Claude Dashboard — Home Assistant
# Design taal: claude.ai (warm dark, koraal, Fraunces serif + Inter sans)
#
# HACS-deps (Frontend):
#   - mushroom
#   - mini-graph-card
#   - card-mod          ← essentieel voor de Claude-website look
#   - neerslag-card     ← reeds in gebruik
#
# Tip: zoek op "FRAUNCES" / "INTER" om typografie globaal aan te passen.
################################################################################

title: Claude

# Herbruikbare style-snippets (YAML anchors)
hero_style: &hero_style
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 32px 4px 4px 4px;
      }
      ha-markdown {
        padding: 0 !important;
      }
      ha-markdown h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 400;
        font-size: clamp(34px, 5vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: var(--claude-cream);
        margin: 0 0 12px 0;
      }
      ha-markdown h2 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 400;
        font-size: clamp(22px, 2.5vw, 28px);
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--claude-cream);
        margin: 0 0 6px 0;
      }
      ha-markdown p {
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--claude-muted);
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
        max-width: 680px;
      }
      ha-markdown .accent {
        color: var(--claude-primary);
      }

stat_style: &stat_style
  card_mod:
    style: |
      ha-card {
        background: var(--claude-surface);
        border: 1px solid var(--claude-border);
        border-radius: 16px;
        padding: 20px 22px;
        transition: border-color 200ms ease, background 200ms ease;
      }
      ha-card:hover {
        border-color: var(--claude-border-hover);
        background: var(--claude-surface-2);
      }
      ha-markdown {
        padding: 0 !important;
      }
      ha-markdown h3 {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--claude-muted);
        margin: 0 0 12px 0;
      }
      ha-markdown .figure {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 40px;
        font-weight: 400;
        line-height: 1;
        color: var(--claude-cream);
        letter-spacing: -0.02em;
      }
      ha-markdown .unit {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        color: var(--claude-muted);
        margin-left: 4px;
      }
      ha-markdown .delta {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px;
        color: var(--claude-primary);
        margin-top: 6px;
      }

views:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. START
  # ════════════════════════════════════════════════════════════════════════════
  - title: Start
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    sections:
      # Hero — serif begroeting
      - type: grid
        column_span: 4
        cards:
          - <<: *hero_style
            type: markdown
            content: |
              # {% set h = now().hour %}{% if h < 6 %}Goedenacht{% elif h < 12 %}Goedemorgen{% elif h < 18 %}Goedemiddag{% else %}Goedenavond{% endif %}, Chris.
              <p>{{ now().strftime('%A %-d %B') }} · <span class="accent">{{ states('weather.forecast_home') }}</span> · {{ state_attr('weather.forecast_home','temperature') }}°C buiten</p>

      # Personen — strakke avatar-rij
      - type: grid
        column_span: 4
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-person-card
                entity: person.chris_joosten
                layout: vertical
                primary_info: name
                secondary_info: state
                icon_type: entity-picture
                fill_container: true
                card_mod:
                  style: |
                    ha-card {
                      background: var(--claude-surface);
                      border: 1px solid var(--claude-border);
                      border-radius: 16px;
                      padding: 20px 16px;
                    }
                    ha-card:hover { border-color: var(--claude-border-hover); }
                    .info .primary { font-family: 'Fraunces', Georgia, serif !important; font-weight: 400; font-size: 18px !important; }
              - type: custom:mushroom-person-card
                entity: person.marion_joosten
                layout: vertical
                primary_info: name
                secondary_info: state
                icon_type: entity-picture
                fill_container: true
                card_mod:
                  style: |
                    ha-card {
                      background: var(--claude-surface);
                      border: 1px solid var(--claude-border);
                      border-radius: 16px;
                      padding: 20px 16px;
                    }
                    ha-card:hover { border-color: var(--claude-border-hover); }
                    .info .primary { font-family: 'Fraunces', Georgia, serif !important; font-weight: 400; font-size: 18px !important; }
              - type: custom:mushroom-person-card
                entity: person.edwin_joosten
                layout: vertical
                primary_info: name
                secondary_info: state
                icon_type: entity-picture
                fill_container: true
                card_mod:
                  style: |
                    ha-card {
                      background: var(--claude-surface);
                      border: 1px solid var(--claude-border);
                      border-radius: 16px;
                      padding: 20px 16px;
                    }
                    ha-card:hover { border-color: var(--claude-border-hover); }
                    .info .primary { font-family: 'Fraunces', Georgia, serif !important; font-weight: 400; font-size: 18px !important; }

      # Vandaag in cijfers — 4 stat-cards
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Vandaag
            heading_style: title
            icon: mdi:weather-sunset
            card_mod:
              style: |
                .container .title {
                  font-family: 'Fraunces', Georgia, serif !important;
                  font-weight: 400 !important;
                  font-size: 28px !important;
                  letter-spacing: -0.01em;
                }
          - <<: *stat_style
            type: markdown
            content: |
              ### Zonneproductie
              <span class="figure">{{ states('sensor.sma_dagopbrengst') }}</span><span class="unit">kWh</span>
              <div class="delta">Nu {{ states('sensor.zonnepanelen_vermogen') }} W</div>
          - <<: *stat_style
            type: markdown
            content: |
              ### Buitentemperatuur
              <span class="figure">{{ state_attr('weather.forecast_home','temperature') }}</span><span class="unit">°C</span>
              <div class="delta">{{ states('weather.forecast_home') }}</div>
          - <<: *stat_style
            type: markdown
            content: |
              ### Volgende afval
              {% set bins = [
                ('PMD', states('sensor.pmd')),
                ('Restafval', states('sensor.restafval')),
                ('Papier', states('sensor.papier'))
              ] %}
              {% set next = bins | sort(attribute=1) | first %}
              <span class="figure" style="font-size:28px;">{{ next[0] }}</span>
              <div class="delta" style="color: var(--claude-cream-dim);">{{ next[1] }}</div>
          - <<: *stat_style
            type: markdown
            content: |
              ### Lampen aan
              <span class="figure">{{ states.switch | selectattr('state','eq','on') | list | count }}</span>
              <div class="delta" style="color: var(--claude-muted);">van {{ states.switch | list | count }} schakelaars</div>

      # Snelle lamp-controles
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Verlichting
            heading_style: title
            icon: mdi:lightbulb-outline
            card_mod:
              style: |
                .container .title {
                  font-family: 'Fraunces', Georgia, serif !important;
                  font-weight: 400 !important;
                  font-size: 28px !important;
                  letter-spacing: -0.01em;
                }
          - type: tile
            entity: switch.woonkamerlamp
            name: Woonkamer
            icon: mdi:sofa-outline
          - type: tile
            entity: switch.overkappinglamp
            name: Overkapping
            icon: mdi:lamps-outline
          - type: tile
            entity: switch.opritlamp
            name: Oprit
            icon: mdi:car-outline
          - type: tile
            entity: switch.spotjes_overkapping
            name: Spotjes
            icon: mdi:track-light

  # ════════════════════════════════════════════════════════════════════════════
  # 2. ZONNEPANELEN
  # ════════════════════════════════════════════════════════════════════════════
  - title: Zonnepanelen
    path: zonnepanelen
    icon: mdi:solar-power
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - <<: *hero_style
            type: markdown
            content: |
              # Zonnepanelen
              <p>Live opbrengst, opbrengstgeschiedenis en handmatige limietsturing voor de SMA-omvormer. Status nu: <span class="accent">{{ states('sensor.zonnepanelen_status') }}</span>, limiet <span class="accent">{{ states('sensor.zonnepanelen_limiet_percentage') }}%</span>.</p>

      # Live cijfers
      - type: grid
        column_span: 4
        cards:
          - <<: *stat_style
            type: markdown
            content: |
              ### Vermogen nu
              <span class="figure">{{ states('sensor.zonnepanelen_vermogen') }}</span><span class="unit">W</span>
          - <<: *stat_style
            type: markdown
            content: |
              ### Vandaag
              <span class="figure">{{ states('sensor.sma_dagopbrengst') }}</span><span class="unit">kWh</span>
          - <<: *stat_style
            type: markdown
            content: |
              ### Totaal
              <span class="figure">{{ states('sensor.sma_totale_opbrengst') }}</span><span class="unit">kWh</span>
          - <<: *stat_style
            type: markdown
            content: |
              ### Limiet
              <span class="figure">{{ states('sensor.zonnepanelen_limiet_percentage') }}</span><span class="unit">%</span>
              <div class="delta">{{ states('sensor.zonnepanelen_status') }}</div>

      # Gauge + grafiek
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Huidig vermogen
            heading_style: subtitle
            card_mod:
              style: |
                .container .title {
                  font-family: 'Inter', sans-serif !important;
                  font-size: 12px !important;
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                  color: var(--claude-muted) !important;
                }
          - type: gauge
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            min: 0
            max: 6000
            needle: true
            severity:
              red: 0
              yellow: 100
              green: 1000
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border);
                  border-radius: 16px;
                  padding: 16px;
                }

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verloop vandaag
            heading_style: subtitle
            card_mod:
              style: |
                .container .title {
                  font-family: 'Inter', sans-serif !important;
                  font-size: 12px !important;
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                  color: var(--claude-muted) !important;
                }
          - type: custom:mini-graph-card
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            hours_to_show: 24
            points_per_hour: 6
            line_width: 2
            line_color: "#C96342"
            smoothing: true
            show:
              fill: fade
              extrema: true
              labels: true
              name: false
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border);
                  border-radius: 16px;
                  padding: 12px;
                }

      # Limietsturing — Claude pill-buttons
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Limiet instellen
            heading_style: title
            icon: mdi:tune-vertical
            card_mod:
              style: |
                .container .title {
                  font-family: 'Fraunces', Georgia, serif !important;
                  font-weight: 400 !important;
                  font-size: 28px !important;
                  letter-spacing: -0.01em;
                }
          - type: button
            name: Volledig
            icon: mdi:solar-power-variant
            icon_height: 32px
            tap_action:
              action: call-service
              service: script.zonnepanelen_aanzetten
              confirmation:
                text: Zonnepanelen op 100% zetten?
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-primary);
                  border: 1px solid var(--claude-primary);
                  border-radius: 16px;
                  padding: 24px 12px;
                  color: var(--claude-cream) !important;
                  transition: background 200ms ease;
                }
                ha-card:hover { background: var(--claude-primary-soft); }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 18px !important; color: var(--claude-cream) !important; }
                ha-card ha-icon { color: var(--claude-cream) !important; }
          - type: button
            name: Halve kracht
            icon: mdi:solar-power
            icon_height: 32px
            tap_action:
              action: call-service
              service: script.zonnepanelen_50_procent
              confirmation:
                text: Zonnepanelen op 50% zetten?
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border-hover);
                  border-radius: 16px;
                  padding: 24px 12px;
                  transition: background 200ms ease;
                }
                ha-card:hover { background: var(--claude-surface-2); }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 18px !important; color: var(--claude-cream) !important; }
                ha-card ha-icon { color: var(--claude-primary-soft) !important; }
          - type: button
            name: Uit
            icon: mdi:power
            icon_height: 32px
            tap_action:
              action: call-service
              service: script.zonnepanelen_uitschakelen
              confirmation:
                text: Zonnepanelen volledig uitschakelen?
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: 1px solid var(--claude-border-hover);
                  border-radius: 16px;
                  padding: 24px 12px;
                  transition: border-color 200ms ease;
                }
                ha-card:hover { border-color: var(--claude-danger); }
                ha-card .name { font-family: 'Fraunces', Georgia, serif !important; font-size: 18px !important; color: var(--claude-cream-dim) !important; }
                ha-card ha-icon { color: var(--claude-muted) !important; }

      # Details
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Details
            heading_style: subtitle
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.zonnepanelen_status
                name: Status
              - entity: sensor.zonnepanelen_limiet_percentage
                name: Vermogenslimiet
              - entity: sensor.sma_dc_vermogen_string_a
                name: DC string A
              - type: divider
              - entity: sensor.sma_ac_vermogen
                name: Raw AC vermogen
              - entity: sensor.sma_limiet_percentage_raw
                name: Raw limiet
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border);
                  border-radius: 16px;
                  padding: 8px 4px;
                }
                .card-header { font-family: 'Fraunces', Georgia, serif !important; font-weight: 400; }

  # ════════════════════════════════════════════════════════════════════════════
  # 3. TV & KLIMAAT (lampen + schema's)
  # ════════════════════════════════════════════════════════════════════════════
  - title: TV & Klimaat
    path: tv-klimaat
    icon: mdi:coach-lamp
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *hero_style
            type: markdown
            content: |
              # Verlichting & schema's
              <p>Schakel lampen handmatig of laat ze op de ingestelde tijden draaien.</p>

      # Lampen — links
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Lampen
            heading_style: subtitle
            icon: mdi:lightbulb-multiple
          - type: tile
            entity: switch.woonkamerlamp
            name: Woonkamer
            icon: mdi:sofa-outline
          - type: tile
            entity: switch.overkappinglamp
            name: Overkapping
            icon: mdi:lamps-outline
          - type: tile
            entity: switch.opritlamp
            name: Oprit
            icon: mdi:car-outline
          - type: tile
            entity: switch.spotjes_overkapping
            name: Spotjes overkapping
            icon: mdi:track-light

      # Schema woonkamer
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Woonkamer schema
            heading_style: subtitle
            icon: mdi:clock-outline
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_datetime.woonkamerlamp_on_time
                name: Aan om
              - entity: input_datetime.woonkamerlamp_off_time
                name: Uit om
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border);
                  border-radius: 16px;
                  padding: 8px 4px;
                }

      # Schema buitenlampen
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Buitenlampen schema
            heading_style: subtitle
            icon: mdi:weather-sunset
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_datetime.buitenlampen_on_time
                name: Aan om
              - entity: input_datetime.buitenlampen_off_time
                name: Uit om
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border);
                  border-radius: 16px;
                  padding: 8px 4px;
                }

  # ════════════════════════════════════════════════════════════════════════════
  # 4. AFVAL
  # ════════════════════════════════════════════════════════════════════════════
  - title: Afval
    path: afval
    icon: mdi:trash-can-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *hero_style
            type: markdown
            content: |
              # Afvalkalender
              <p>De volgende ophaaldagen volgens de gemeentekalender.</p>

      # Conditioneel: morgen buitenzetten
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.pmd
                    state: Morgen
                  - condition: state
                    entity: sensor.restafval
                    state: Morgen
                  - condition: state
                    entity: sensor.papier
                    state: Morgen
            card:
              type: markdown
              content: |
                ## ✱ Morgen buitenzetten
                <p>{% if is_state('sensor.pmd','Morgen') %}PMD · {% endif %}{% if is_state('sensor.restafval','Morgen') %}Restafval · {% endif %}{% if is_state('sensor.papier','Morgen') %}Papier{% endif %}</p>
              card_mod:
                style: |
                  ha-card {
                    background: linear-gradient(135deg, rgba(201, 99, 66, 0.18) 0%, rgba(201, 99, 66, 0.04) 100%);
                    border: 1px solid var(--claude-primary);
                    border-radius: 16px;
                    padding: 18px 22px;
                  }
                  ha-markdown { padding: 0 !important; }
                  ha-markdown h2 {
                    font-family: 'Fraunces', Georgia, serif !important;
                    font-weight: 400;
                    font-size: 24px;
                    color: var(--claude-cream) !important;
                    margin: 0 0 6px 0;
                  }
                  ha-markdown p {
                    font-family: 'Inter', sans-serif !important;
                    color: var(--claude-cream-dim) !important;
                    margin: 0;
                  }

      # Drie afval-cards met serif typografie
      - type: grid
        column_span: 3
        cards:
          - <<: *stat_style
            type: markdown
            content: |
              ### PMD
              <span class="figure" style="font-size:32px;">{{ states('sensor.pmd') }}</span>
              <div class="delta">Plastic, metaal & drinkpakken</div>
            tap_action:
              action: more-info
              entity: sensor.pmd
          - <<: *stat_style
            type: markdown
            content: |
              ### Restafval
              <span class="figure" style="font-size:32px;">{{ states('sensor.restafval') }}</span>
              <div class="delta">Niet recyclebaar</div>
            tap_action:
              action: more-info
              entity: sensor.restafval
          - <<: *stat_style
            type: markdown
            content: |
              ### Papier
              <span class="figure" style="font-size:32px;">{{ states('sensor.papier') }}</span>
              <div class="delta">Karton & papier</div>
            tap_action:
              action: more-info
              entity: sensor.papier

  # ════════════════════════════════════════════════════════════════════════════
  # 5. WEER
  # ════════════════════════════════════════════════════════════════════════════
  - title: Weer
    path: weer
    icon: mdi:weather-partly-cloudy
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *hero_style
            type: markdown
            content: |
              # Weer & klimaat
              <p>Het is nu <span class="accent">{{ state_attr('weather.forecast_home','temperature') }}°C</span> · {{ states('weather.forecast_home') }}. Binnen op {{ state_attr('climate.woonkamer','current_temperature') }}°C.</p>

      # Thermostaat
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Thermostaat
            heading_style: subtitle
          - type: custom:mushroom-climate-card
            entity: climate.woonkamer
            name: Woonkamer
            show_temperature_control: true
            hvac_modes:
              - 'off'
              - cool
              - heat
              - fan_only
            fill_container: true
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border);
                  border-radius: 16px;
                  padding: 18px;
                }
                .info .primary {
                  font-family: 'Fraunces', Georgia, serif !important;
                  font-weight: 400 !important;
                  font-size: 18px !important;
                }

      # Forecast
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 5-daagse voorspelling
            heading_style: subtitle
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: false
            card_mod:
              style: |
                ha-card {
                  background: var(--claude-surface);
                  border: 1px solid var(--claude-border);
                  border-radius: 16px;
                  padding: 12px;
                }

      # Neerslag
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Neerslag radar
            heading_style: subtitle
          - type: custom:neerslag-card
            entity: sensor.neerslag_buienalarm_regen_data
            title: ' '
            card_mod:
