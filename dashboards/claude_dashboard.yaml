################################################################################
# Claude Dashboard — exact pixel-match aan de mobile-mockup
# Inline HTML+styles in markdown-cards omzeilen ha-markdown's shadow DOM,
# zodat fonts en lay-out altijd kloppen ongeacht card-mod selectors.
#
# HACS-deps: card-mod, mushroom, mini-graph-card, neerslag-card
# Vereist www/claude-fonts.js voor Fraunces+Inter
################################################################################

title: Claude

# ════════════════════════════════════════════════════════════════════════════
# Herbruikbare card_mod blokken (YAML anchors)
# ════════════════════════════════════════════════════════════════════════════

# Transparante card zonder bg/border (voor heroes en nav)
ghost_card: &ghost_card
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      ha-markdown { padding: 0 !important; }

# Standaard surface-card met subtiele border
surface_card: &surface_card
  card_mod:
    style: |
      ha-card {
        background: var(--claude-surface) !important;
        border: 1px solid var(--claude-border) !important;
        border-radius: 16px !important;
        box-shadow: none !important;
        padding: 16px !important;
        transition: border-color 200ms ease, background 200ms ease;
      }
      ha-card:hover {
        border-color: var(--claude-border-hover) !important;
      }
      ha-markdown { padding: 0 !important; }

# ════════════════════════════════════════════════════════════════════════════
# Bottom navigation per view (active state hardcoded)
# ════════════════════════════════════════════════════════════════════════════

# Reusable nav button styles
nav_active: &nav_active
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 6px 4px !important; }
      mushroom-shape-icon { --shape-color: transparent !important; --icon-color: var(--claude-primary) !important; --icon-size: 28px !important; }
      .container { padding: 0 !important; }
      .container .primary { color: var(--claude-primary) !important; font-size: 10px !important; font-weight: 500 !important; text-align: center; }
      mushroom-state-info { text-align: center; }

nav_inactive: &nav_inactive
  card_mod:
    style: |
      ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 6px 4px !important; }
      mushroom-shape-icon { --shape-color: transparent !important; --icon-color: var(--claude-muted) !important; --icon-size: 28px !important; }
      .container { padding: 0 !important; }
      .container .primary { color: var(--claude-muted) !important; font-size: 10px !important; font-weight: 500 !important; text-align: center; }
      mushroom-state-info { text-align: center; }

# Outer wrapper: maakt de nav fixed onderaan op mobile
nav_wrapper: &nav_wrapper
  card_mod:
    style: |
      :host {
        display: block;
        margin-top: 24px;
        background: rgba(31, 30, 28, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--claude-border);
        border-radius: 22px;
        padding: 4px 6px;
      }
      @media (max-width: 870px) {
        :host {
          position: fixed !important;
          bottom: 12px !important;
          left: 12px !important;
          right: 12px !important;
          z-index: 999 !important;
          margin-top: 0 !important;
        }
      }

# ════════════════════════════════════════════════════════════════════════════
# VIEWS
# ════════════════════════════════════════════════════════════════════════════
views:

  # ───────────────────────────────────────────────────────────────────────
  # 1. START
  # ───────────────────────────────────────────────────────────────────────
  - title: Start
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4
    sections:

      # ── HERO ────────────────────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div style="padding:16px 4px 12px;">
                <div style="font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:clamp(34px,7vw,52px); line-height:1.05; letter-spacing:-0.02em; color:var(--claude-cream); margin-bottom:10px;">{% set h = now().hour %}{% if h < 6 %}Goedenacht{% elif h < 12 %}Goedemorgen{% elif h < 18 %}Goedemiddag{% else %}Goedenavond{% endif %}, Chris.</div>
                <div style="font-family:'Inter',system-ui,sans-serif; font-size:14px; color:var(--claude-muted); line-height:1.5;">{{ now().strftime('%A %-d %B') }} · <span style="color:var(--claude-primary);">{{ states('weather.forecast_home') }}</span> · {{ state_attr('weather.forecast_home','temperature') }}°C</div>
              </div>

      # ── PERSONS (gekleurde initiaal-avatars) ──────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
                <div style="background:var(--claude-surface); border:1px solid var(--claude-border); border-radius:16px; padding:18px 12px; text-align:center;">
                  <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#C96342,#A84F32); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',Georgia,serif; font-size:22px; font-weight:400; color:#F0EEE6;">CJ</div>
                  <div style="font-family:'Fraunces',Georgia,serif; font-size:16px; color:var(--claude-cream);">Chris</div>
                  <div style="font-size:11px; color:var(--claude-muted); margin-top:2px;">{% if is_state('person.chris_joosten','home') %}Thuis{% elif is_state('person.chris_joosten','not_home') %}Onderweg{% else %}{{ states('person.chris_joosten') }}{% endif %}</div>
                </div>
                <div style="background:var(--claude-surface); border:1px solid var(--claude-border); border-radius:16px; padding:18px 12px; text-align:center;">
                  <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#7BA7C9,#4A6E8A); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',Georgia,serif; font-size:22px; font-weight:400; color:#F0EEE6;">MJ</div>
                  <div style="font-family:'Fraunces',Georgia,serif; font-size:16px; color:var(--claude-cream);">Marion</div>
                  <div style="font-size:11px; color:var(--claude-muted); margin-top:2px;">{% if is_state('person.marion_joosten','home') %}Thuis{% elif is_state('person.marion_joosten','not_home') %}Onderweg{% else %}{{ states('person.marion_joosten') }}{% endif %}</div>
                </div>
                <div style="background:var(--claude-surface); border:1px solid var(--claude-border); border-radius:16px; padding:18px 12px; text-align:center;">
                  <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#7FB069,#4A7B4A); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',Georgia,serif; font-size:22px; font-weight:400; color:#F0EEE6;">EJ</div>
                  <div style="font-family:'Fraunces',Georgia,serif; font-size:16px; color:var(--claude-cream);">Edwin</div>
                  <div style="font-size:11px; color:var(--claude-muted); margin-top:2px;">{% if is_state('person.edwin_joosten','home') %}Thuis{% elif is_state('person.edwin_joosten','not_home') %}Onderweg{% else %}{{ states('person.edwin_joosten') }}{% endif %}</div>
                </div>
              </div>

      # ── VANDAAG SECTION TITLE ──────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div style="font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:26px; letter-spacing:-0.01em; color:var(--claude-cream); margin:8px 4px 8px;">Vandaag</div>

      # ── 4 STAT CARDS ───────────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Zon</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ states('sensor.sma_dagopbrengst') }}</span><span style="font-size:13px; color:var(--claude-muted); margin-left:4px;">kWh</span></div>
                <div style="font-size:12px; color:var(--claude-primary); margin-top:6px;">{{ states('sensor.zonnepanelen_vermogen') }} W nu</div>
              </div>
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Buiten</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ state_attr('weather.forecast_home','temperature') }}</span><span style="font-size:13px; color:var(--claude-muted); margin-left:4px;">°C</span></div>
                <div style="font-size:12px; color:var(--claude-primary); margin-top:6px;">{{ states('weather.forecast_home') }}</div>
              </div>
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Volgend afval</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:24px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">
                {%- set bins = [
                  ('PMD', states('sensor.pmd')),
                  ('Restafval', states('sensor.restafval')),
                  ('Papier', states('sensor.papier'))
                ] -%}
                {{ bins[0][0] }}</span></div>
                <div style="font-size:12px; color:var(--claude-cream-dim); margin-top:6px;">{{ bins[0][1] }}</div>
              </div>
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Lampen</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ expand('switch.woonkamerlamp','switch.overkappinglamp','switch.opritlamp','switch.spotjes_overkapping') | selectattr('state','eq','on') | list | count }}</span><span style="font-size:13px; color:var(--claude-muted); margin-left:4px;">/4 aan</span></div>
                <div style="font-size:12px; color:var(--claude-muted); margin-top:6px;">4 schakelaars</div>
              </div>

      # ── VERLICHTING ─────────────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div style="font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:26px; letter-spacing:-0.01em; color:var(--claude-cream); margin:16px 4px 8px;">Verlichting</div>
          - type: tile
            entity: switch.woonkamerlamp
            name: Woonkamer
            icon: mdi:sofa-outline
          - type: tile
            entity: switch.overkappinglamp
            name: Overkapping
            icon: mdi:lamps-outline
          - type: tile
            entity: switch.opritlamp
            name: Oprit
            icon: mdi:car-outline
          - type: tile
            entity: switch.spotjes_overkapping
            name: Spotjes
            icon: mdi:track-light

      # ── BOTTOM NAV (Start active) ──────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
                tap_action: { action: navigate, navigation_path: /claude-dashboard/benzine }

  # ───────────────────────────────────────────────────────────────────────
  # 2. ZONNEPANELEN
  # ───────────────────────────────────────────────────────────────────────
  - title: Zonnepanelen
    path: zonnepanelen
    icon: mdi:weather-sunny
    type: sections
    max_columns: 4
    sections:

      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div style="padding:16px 4px 12px;">
                <div style="font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:clamp(34px,7vw,52px); line-height:1.05; letter-spacing:-0.02em; color:var(--claude-cream); margin-bottom:10px;">Zonnepanelen</div>
                <div style="font-family:'Inter',system-ui,sans-serif; font-size:14px; color:var(--claude-muted); line-height:1.5;">Status <span style="color:var(--claude-primary);">{{ states('sensor.zonnepanelen_status') }}</span> · limiet <span style="color:var(--claude-primary);">{{ states('sensor.zonnepanelen_limiet_percentage') }}%</span></div>
              </div>

      - type: grid
        column_span: 4
        cards:
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Nu</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ states('sensor.zonnepanelen_vermogen') }}</span><span style="font-size:13px; color:var(--claude-muted); margin-left:4px;">W</span></div>
              </div>
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Vandaag</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ states('sensor.sma_dagopbrengst') }}</span><span style="font-size:13px; color:var(--claude-muted); margin-left:4px;">kWh</span></div>
              </div>
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Totaal</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ states('sensor.sma_totale_opbrengst') }}</span><span style="font-size:13px; color:var(--claude-muted); margin-left:4px;">kWh</span></div>
              </div>
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Limiet</div>
                <div><span style="font-family:'Fraunces',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ states('sensor.zonnepanelen_limiet_percentage') }}</span><span style="font-size:13px; color:var(--claude-muted); margin-left:4px;">%</span></div>
              </div>

      # ── Vermogen + grafiek ──────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin:8px 4px;">Vermogen</div>'
          - type: gauge
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            min: 0
            max: 6000
            needle: true
            severity: { red: 0, yellow: 100, green: 1000 }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; padding: 16px !important; box-shadow: none !important; }

      - type: grid
        column_span: 2
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin:8px 4px;">Verloop vandaag</div>'
          - type: custom:mini-graph-card
            entity: sensor.zonnepanelen_vermogen
            name: ' '
            hours_to_show: 24
            points_per_hour: 6
            line_width: 2
            line_color: '#C96342'
            smoothing: true
            show: { fill: fade, extrema: true, labels: true, name: false }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border) !important; border-radius: 16px !important; padding: 12px !important; box-shadow: none !important; }

      # ── Limiet pillen ───────────────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *ghost_card
            type: markdown
            content: '<div style="font-family:''Fraunces'',Georgia,serif; font-weight:400; font-size:26px; letter-spacing:-0.01em; color:var(--claude-cream); margin:16px 4px 8px;">Limiet</div>'
          - type: button
            name: 100%
            icon: mdi:weather-sunny
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_aanzetten, confirmation: { text: 'Op 100% zetten?' } }
            card_mod:
              style: |
                ha-card { background: var(--claude-primary) !important; border: 1px solid var(--claude-primary) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces',Georgia,serif !important; font-size: 16px !important; color: var(--claude-cream) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-cream) !important; }
          - type: button
            name: 50%
            icon: mdi:circle-half-full
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_50_procent, confirmation: { text: 'Op 50% zetten?' } }
            card_mod:
              style: |
                ha-card { background: var(--claude-surface) !important; border: 1px solid var(--claude-border-hover) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces',Georgia,serif !important; font-size: 16px !important; color: var(--claude-cream) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-primary-soft) !important; }
          - type: button
            name: Uit
            icon: mdi:power
            icon_height: 32px
            tap_action: { action: call-service, service: script.zonnepanelen_uitschakelen, confirmation: { text: 'Volledig uitschakelen?' } }
            card_mod:
              style: |
                ha-card { background: transparent !important; border: 1px solid var(--claude-border-hover) !important; border-radius: 16px !important; padding: 20px 12px !important; box-shadow: none !important; }
                ha-card .name { font-family: 'Fraunces',Georgia,serif !important; font-size: 16px !important; color: var(--claude-cream-dim) !important; font-weight: 400 !important; }
                ha-card ha-icon { color: var(--claude-muted) !important; }

      # ── Bottom nav (Zon active) ─────────────────────────────────────────
      - type: grid
        column_span: 4
        cards:
          - <<: *nav_wrapper
            type: horizontal-stack
            cards:
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Start
                icon: mdi:home
                tap_action: { action: navigate, navigation_path: /claude-dashboard/home }
              - <<: *nav_active
                type: custom:mushroom-template-card
                primary: Zon
                icon: mdi:weather-sunny
                tap_action: { action: navigate, navigation_path: /claude-dashboard/zonnepanelen }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Lampen
                icon: mdi:lightbulb-outline
                tap_action: { action: navigate, navigation_path: /claude-dashboard/tv-klimaat }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Afval
                icon: mdi:recycle
                tap_action: { action: navigate, navigation_path: /claude-dashboard/afval }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Weer
                icon: mdi:weather-partly-cloudy
                tap_action: { action: navigate, navigation_path: /claude-dashboard/weer }
              - <<: *nav_inactive
                type: custom:mushroom-template-card
                primary: Benzine
                icon: mdi:gas-station
                tap_action: { action: navigate, navigation_path: /claude-dashboard/benzine }

  # ───────────────────────────────────────────────────────────────────────
  # 3. TV & KLIMAAT (lampen)
  # ───────────────────────────────────────────────────────────────────────
  - title: TV & Klimaat
    path: tv-klimaat
    icon: mdi:lightbulb-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - <<: *ghost_card
            type: markdown
            content: |
              <div style="padding:16px 4px 12px;">
                <div style="font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:clamp(30px,7vw,46px); line-height:1.05; letter-spacing:-0.02em; color:var(--claude-cream); margin-bottom:10px;">Verlichting &amp; schema's</div>
