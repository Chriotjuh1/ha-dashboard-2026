              </div>
          - <<: *surface_card
            type: markdown
            content: |
              <div>
                <div style="font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--claude-muted); margin-bottom:10px;">Restafval</div>
                <div style="font-family:'Fraunces',Georgia,serif; font-size:24px; line-height:1; letter-spacing:-0.02em; color:var(--claude-cream);">{{ states('sensor.restafval') }}</div>
