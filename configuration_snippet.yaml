# ─────────────────────────────────────────────────────────────────
# Add the blocks below to your Home Assistant configuration.yaml
# (or merge with existing keys). After saving, restart HA.
# ─────────────────────────────────────────────────────────────────

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    # ?v= forceert dat de browser/Companion-app de nieuwe versie ophaalt
    # i.p.v. de gecachte. Bump het nummer wanneer je claude-fonts.js update.
    - /local/claude-fonts.js?v=8

notify:
  - name: gezin_joosten
    platform: group
    services:
      - service: mobile_app_pixel_10_van_chris
      - service: mobile_app_marion
      - service: mobile_app_sm_s921b   # Edwin – verifieer naam via Ontwikkeltools → Acties → notify.mobile_app

lovelace:
  mode: storage
  dashboards:
    claude-dashboard:
      mode: yaml
      title: Claude
      icon: mdi:hexagon-multiple
      show_in_sidebar: true
      filename: dashboards/claude_dashboard.yaml
    joosten-app:
      mode: yaml
      title: Thuis
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/joosten_app.yaml
