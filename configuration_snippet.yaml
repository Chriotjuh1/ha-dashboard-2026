# ─────────────────────────────────────────────────────────────────
# Add the blocks below to your Home Assistant configuration.yaml
# (or merge with existing keys). After saving, restart HA.
# ─────────────────────────────────────────────────────────────────

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/claude-fonts.js

lovelace:
  mode: storage
  dashboards:
    claude-dashboard:
      mode: yaml
      title: Claude
      icon: mdi:hexagon-multiple
      show_in_sidebar: true
      filename: dashboards/claude_dashboard.yaml

panel_iframe:
  joosten:
    title: Thuis
    icon: mdi:hexagon-multiple
    url: /local/dashboard/
    require_admin: false
