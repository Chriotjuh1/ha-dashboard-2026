  // ──────────────────────────────────────────────────────────────────
  // VIEW: Zonnepanelen
  // ──────────────────────────────────────────────────────────────────
  // Zoekt de dynamische stroomprijs-sensoren op naam, zodat dit werkt met
  // EnergyZero, Nord Pool, Frank Energie, ENTSO-e enz. zonder vaste ids.
  _priceInfo(c) {
    const num = id => { const v = parseFloat(c.state(id)); return isNaN(v) ? null : v; };
    const ids = (c.entityIds && c.entityIds('sensor.')) || [];
    const elec = ids.filter(id =>
      /energyzero|energiezero|nordpool|nord_pool|epex|frank|entsoe|stroomprijs|electricity_price|energy_price|marktprijs|market_price|zonneplan/i.test(id)
      && !/gas|water|tank/i.test(id));
    // Handmatig vastgezette sensoren (zie bovenin) winnen altijd van de
    // automatische naamherkenning.
    const pinnedAllIn = PRICE_SENSOR_ALL_IN && num(PRICE_SENSOR_ALL_IN) !== null ? PRICE_SENSOR_ALL_IN : null;
    const pinnedMarket = PRICE_SENSOR_MARKET && num(PRICE_SENSOR_MARKET) !== null ? PRICE_SENSOR_MARKET : null;
    if (!elec.length && !pinnedAllIn && !pinnedMarket) return null;

    // Dagsamenvattingen (laagste/hoogste/gemiddelde) en tijdstip-sensoren zijn
    // nooit "de prijs nu" — Frank Energie levert die namelijk ook aan.
    const isSummary = id =>
      /time|tijd|_max_|_min_|average|gemiddeld|lowest|highest|laagste|hoogste|next|hours|tomorrow|morgen/i.test(id);
    // Grote getal = de all-in prijs: wat je daadwerkelijk betaalt, inclusief
    // energiebelasting en btw. Vandaar dat een sensor met "all in" in de naam
    // voorrang krijgt, en een kale marktprijs juist als laatste komt.
    const isMarketId = id => /market[_ ]?price|marktprijs|marketprice/i.test(id) && !/all[_ ]?in/i.test(id);
    const curId = pinnedAllIn
      || elec.find(id => /all[_ ]?in/i.test(id) && !isSummary(id) && num(id) !== null)
      || elec.find(id => /current[_ ]?(hour|electricity)|huidige/i.test(id) && !isSummary(id) && !isMarketId(id) && num(id) !== null)
      || elec.find(id => /price|prijs/i.test(id) && !isSummary(id) && !isMarketId(id) && num(id) !== null)
      || elec.find(id => num(id) !== null);
    const current = curId ? num(curId) : null;
    const unit = curId ? (c.attr(curId, 'unit_of_measurement') || '€/kWh') : '€/kWh';
    // Is de getoonde prijs zelf al een kale marktprijs, dan is er geen
    // all-in prijs beschikbaar en moeten we dat niet suggereren.
    const currentIsAllIn = !!curId && !isMarketId(curId);

    // Marktprijs (kale inkoopprijs, zonder belasting en btw). Die bepaalt of
    // terugleveren geld kost: de all-in prijs is door de energiebelasting
    // vrijwel nooit negatief, ook niet als de markt diep negatief staat.
    const mktId = pinnedMarket || elec.find(id => isMarketId(id) && !isSummary(id) && num(id) !== null);
    const market = mktId && mktId !== curId ? num(mktId) : null;

    // Uurprijzen uit de attributen. Elke integratie doet dit anders, dus we
    // proberen eerst de bekende namen en scannen daarna gewoon alle
    // attributen op iets dat eruitziet als een reeks tijd+prijs. Dat is
    // robuuster dan een vaste lijst: die miste precies deze sensor.
    const TIME_KEYS = ['time', 'start', 'from', 'datetime', 'readingDate',
                       'startsAt', 'start_time', 'timestamp', 'date', 'hour'];
    const VAL_KEYS = ['price', 'value', 'amount', 'electricityPrice', 'marketPrice',
                      'total', 'price_per_kwh', 'cost', 'tarief'];
    const pick = (o, keys) => { for (const k of keys) if (o[k] != null) return o[k]; return null; };
    const parseSeries = arr => {
      if (!Array.isArray(arr) || arr.length < 5) return null;
      const out = arr.map(e => {
        if (!e || typeof e !== 'object') return null;
        const tv = pick(e, TIME_KEYS);
        const vv = pick(e, VAL_KEYS);
        if (tv == null || vv == null) return null;
        const d = new Date(tv);
        const n = parseFloat(vv);
        return (isNaN(d.getTime()) || isNaN(n)) ? null : { t: d, v: n };
      }).filter(Boolean);
      return out.length >= 5 ? out : null;
    };
    const dedupe = list => {
      const seen = new Map();
      for (const h of list) seen.set(h.t.getTime(), h);
      return [...seen.values()].sort((a, b) => a.t - b.t);
    };
    const PREFERRED = ['prices', 'raw_today', 'today', 'data', 'prices_today', 'hourly', 'forecast'];
    const readHourly = id => {
      const all = (c.attrs && c.attrs(id)) || {};
      for (const key of PREFERRED) {
        const found = parseSeries(all[key]);
        if (!found) continue;
        // today-achtige attributen hebben vaak een losse tomorrow-tegenhanger;
        // die plakken we eraan zodat "wanneer wordt het negatief" verder kijkt.
        const extra = /today$/.test(key) ? parseSeries(all[key.replace(/today$/, 'tomorrow')]) : null;
        return dedupe(extra ? found.concat(extra) : found);
      }
      // Onbekende integratie: scan alle overige attributen.
      for (const [key, val] of Object.entries(all)) {
        if (PREFERRED.includes(key)) continue;
        const found = parseSeries(val);
        if (found) return dedupe(found);
      }
      // Variant waarin de prijzen een object zijn: { "2026-08-02T14:00": 0.11 }
      for (const val of Object.values(all)) {
        if (!val || typeof val !== 'object' || Array.isArray(val)) continue;
        const out = Object.entries(val).map(([k, v]) => {
          const d = new Date(k);
          const n = parseFloat(v);
          return (isNaN(d.getTime()) || isNaN(n)) ? null : { t: d, v: n };
        }).filter(Boolean);
        if (out.length >= 5) return dedupe(out);
      }
      return null;
    };

    // Voor de staafjes: de prijs die je zelf betaalt, dus bij voorkeur de
    // sensor die ook bovenaan staat.
    let hourly = (curId && readHourly(curId)) || null;
    if (!hourly) { for (const id of elec) { hourly = readHourly(id); if (hourly) break; } }
    hourly = hourly || [];
    // Voor "wanneer wordt het negatief": marktprijzen als we die hebben.
    const mktHourly = (mktId && readHourly(mktId)) || null;

    const vals = hourly.map(h => h.v);
    const now = Date.now();
    const fresh = arr => arr.filter(h => h.t.getTime() >= now - 3600000);
    const future = fresh(hourly);
    // Dezelfde grondslag als het advies (zie SOLAR_PRICE_BASIS), anders zou de
    // waarschuwing "vanaf 18:00 wordt het negatief" op een andere prijs slaan
    // dan de conclusie eronder.
    const negSource = fresh(SOLAR_PRICE_BASIS === 'market' ? (mktHourly || hourly) : hourly);
    return {
      current,
      market,
      currentIsAllIn,
      unit,
      hourly,
      min: vals.length ? Math.min(...vals) : null,
      max: vals.length ? Math.max(...vals) : null,
      avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null,
      cheapest: future.length ? future.reduce((a, b) => (b.v < a.v ? b : a)) : null,
      nextNegative: negSource.find(h => h.v < 0) || null,
    };
  }

  // Advies of het slim is de zonnepanelen (tijdelijk) uit te zetten.
  // Uitgangspunt: dynamisch contract — bij een negatieve prijs betaal je
  // geld toe over elke kWh die je teruglevert.
  _solarAdvice(c, p) {
    const power = parseFloat(c.state('sensor.zonnepanelen_vermogen')) || 0;
    const producing = power > 100;
    // Bewust GEEN aan/uit-conclusie uit sensor.zonnepanelen_limiet_percentage:
    // die stond op 0% terwijl de panelen bijna 4 kW stonden te leveren, dus
    // 0 betekent hier "geen begrenzing" en niet "uit". Het gemeten vermogen is
    // de enige ondubbelzinnige bron voor "lever ik op dit moment terug".
    // Zie SOLAR_PRICE_BASIS bovenin: onder saldering is een teruggeleverde kWh
    // de all-in prijs waard, daarbuiten alleen de kale marktprijs.
    const useMarket = SOLAR_PRICE_BASIS === 'market' && p && p.market != null;
    const price = p ? (useMarket ? p.market : p.current) : null;
    const label = useMarket ? 'marktprijs' : p && p.currentIsAllIn ? 'all-in prijs' : 'stroomprijs';
    const t = d => d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });

    if (price === null) {
      return { level: 'neutral', title: 'Geen prijsinformatie',
        body: 'Er is geen dynamische stroomprijs gevonden, dus ik kan geen advies geven.' };
    }

    const fmt = n => '€ ' + Math.abs(n).toLocaleString('nl-NL', { minimumFractionDigits: 3, maximumFractionDigits: 3 });

    // Negatieve prijs → terugleveren kost geld
    if (price < -0.001) {
      if (producing) {
        const perHour = (power / 1000) * Math.abs(price);
        return { level: 'bad', title: 'Overweeg de panelen uit te zetten',
          body: `De ${label} is nu <strong>−${fmt(price)}/kWh</strong>. Je levert ${formatNumber(power, 0)} W terug en betaalt daar op dit moment ongeveer <strong>${fmt(perHour)} per uur</strong> op toe.` };
      }
      return { level: 'good', title: 'Niets aan de hand',
        body: `De ${label} is negatief (−${fmt(price)}/kWh), maar je levert nu niets terug. Zolang dat zo blijft, kost het je ook niets.` };
    }

    // Positieve prijs — eventueel waarschuwen voor negatieve uren later
    const soon = p.nextNegative;
    const warning = soon
      ? ` Let op: vanaf <strong>${t(soon.t)}</strong> wordt de prijs negatief, dan kun je beter uitzetten.`
      : '';
    if (!producing) {
      return { level: 'neutral', title: 'Geen opbrengst op dit moment',
        body: `De ${label} is ${fmt(price)}/kWh, dus terugleveren zou lonen, maar je wekt nu vrijwel niets op.` + warning };
    }
    return { level: 'good', title: 'Laat de panelen aanstaan',
      body: `De ${label} is ${fmt(price)}/kWh, dus terugleveren levert gewoon geld op.` + warning };
  }

  // Stroomprijs-blok: prijs nu, dagcijfers en een staafje per uur.
  _priceSection(c, p) {
    const eur = n => '€ ' + n.toLocaleString('nl-NL', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
    const t = d => d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    const now = Date.now();

    let bars = '';
    if (p.hourly.length >= 5) {
      const lo = Math.min(0, p.min);
      const hi = Math.max(p.max, 0.001);
      const span = (hi - lo) || 1;
      // Slotlengte uit de data zelf halen: Nord Pool levert sinds kort
      // kwartierprijzen, dus een vaste 60 minuten zou het "nu"-staafje
      // vier vakjes te breed maken.
      const slot = p.hourly.length > 1
        ? Math.max(60000, p.hourly[1].t.getTime() - p.hourly[0].t.getTime())
        : 3600000;
      bars = `
        <div class="price-bars">
          ${p.hourly.map(h => {
            const isNow = now >= h.t.getTime() && now < h.t.getTime() + slot;
            const cls = h.v < 0 ? 'neg' : (p.avg != null && h.v <= p.avg * 0.8) ? 'cheap'
                      : (p.avg != null && h.v >= p.avg * 1.25) ? 'exp' : '';
            const pct = Math.max(4, Math.round(((h.v - lo) / span) * 100));
            return `<div class="pb ${cls}${isNow ? ' now' : ''}" style="height:${pct}%"
                      title="${esc(t(h.t))} · ${esc(eur(h.v))}"></div>`;
          }).join('')}
        </div>
        <div class="price-axis"><span>${esc(t(p.hourly[0].t))}</span><span>${esc(t(p.hourly[p.hourly.length - 1].t))}</span></div>`;
    }

    return `
      <div class="subsection-title">Stroomprijs</div>
      <div class="card price-card">
        <div class="price-head">
          <div>
            <div class="price-now ${p.current < 0 ? 'neg' : ''}">${esc(eur(p.current))}</div>
            <div class="price-unit">${esc(p.unit)} · nu${p.currentIsAllIn ? ' · all-in' : ''}</div>
          </div>
          <div class="price-meta">
            ${p.min !== null ? `<span>laag ${esc(eur(p.min))}</span>` : ''}
            ${p.avg !== null ? `<span>gem ${esc(eur(p.avg))}</span>` : ''}
            ${p.max !== null ? `<span>hoog ${esc(eur(p.max))}</span>` : ''}
            ${p.market !== null ? `<span>markt ${esc(eur(p.market))}</span>` : ''}
            ${p.cheapest ? `<span class="cheapest">goedkoopst om ${esc(t(p.cheapest.t))}</span>` : ''}
          </div>
        </div>
        ${bars}
      </div>`;
  }

  renderZon(c) {
    const power = parseFloat(c.state('sensor.zonnepanelen_vermogen')) || 0;
    const max = 6000;
    const progress = Math.min(1, Math.max(0, power / max));
    // Half-circle from 180° to 0° (left to right, top half).
    // Compute end-point on the arc using proper trigonometry.
    const theta = (180 - progress * 180) * Math.PI / 180;
    const endX = 100 + 80 * Math.cos(theta);
    const endY = 110 - 80 * Math.sin(theta);
    // Half-cirkel arc is altijd ≤ 180°, dus large-arc-flag is altijd 0.
    // Hierdoor tekent de browser het korte pad over de bovenkant i.p.v.
    // het lange pad onderlangs (wat de tweedelige glitch veroorzaakte).
    const largeArc = 0;
    const needleX = endX;
    const needleY = endY;

    const price = this._priceInfo(c);
    const advice = this._solarAdvice(c, price);

    // "Limiet 0%" las alsof de panelen uit stonden, terwijl ze op dat moment
    // bijna 4 kW leverden. 0 betekent hier "niet afgeregeld", dus tonen we dat
    // ook zo — en het label is nu Begrenzing i.p.v. Limiet.
    const limitRaw = parseFloat(c.state('sensor.zonnepanelen_limiet_percentage'));
    const hasLimit = !isNaN(limitRaw);
    const limitFigure = !hasLimit ? '—' : limitRaw <= 0 ? 'Geen' : formatNumber(limitRaw, 0);
    const limitUnit = hasLimit && limitRaw > 0 ? '%' : '';
    const limitText = !hasLimit ? '—' : limitRaw <= 0 ? 'geen' : formatNumber(limitRaw, 0) + '%';

    // De opbrengst-sensoren staan in Wh, niet in kWh — hardcoded "kWh" gaf
    // onzin (14.439.235 kWh = 14,4 GWh). Lees de echte eenheid en reken door
    // naar kWh, zodat het klopt ongeacht hoe de integratie het aanlevert.
    const energyTile = (eid) => {
      const raw = parseFloat(c.state(eid));
      if (isNaN(raw)) return { figure: '—', unit: '' };
      const u = String(c.attr(eid, 'unit_of_measurement') || 'kWh');
      let val = raw;
      if (/^wh$/i.test(u)) val = raw / 1000;
      else if (/^mwh$/i.test(u)) val = raw * 1000;
      else if (!/^kwh$/i.test(u)) return { figure: formatNumber(raw, 0), unit: u };
      return { figure: formatNumber(val, Math.abs(val) < 100 ? 1 : 0), unit: 'kWh' };
    };
    const vandaag = energyTile('sensor.sma_dagopbrengst');
    const totaal = energyTile('sensor.sma_totale_opbrengst');

    return `
      <div class="view active">
        <div class="hero">
          <h1>Zonnepanelen</h1>
          <p>Status <span class="accent">${esc(c.state('sensor.zonnepanelen_status')) || '—'}</span> · begrenzing <span class="accent">${esc(limitText)}</span></p>
        </div>

        ${advice ? `
          <div class="advice ${esc(advice.level)}">
            <div class="advice-icon">${advice.level === 'good' ? '✓' : advice.level === 'bad' ? '!' : advice.level === 'warn' ? '~' : '?'}</div>
            <div class="advice-text">
              <h3>${esc(advice.title)}</h3>
              <p>${advice.body}</p>
            </div>
          </div>
        ` : ''}

        ${price && price.current !== null ? this._priceSection(c, price) : ''}

        <div class="grid grid-4">
          <div class="card stat">
            <div class="label">Nu</div>
            <div><span class="figure">${formatNumber(power, 0)}</span><span class="unit">W</span></div>
          </div>
          <div class="card stat">
            <div class="label">Vandaag</div>
            <div><span class="figure">${esc(vandaag.figure)}</span><span class="unit">${esc(vandaag.unit)}</span></div>
          </div>
          <div class="card stat">
            <div class="label">Totaal</div>
            <div><span class="figure">${esc(totaal.figure)}</span><span class="unit">${esc(totaal.unit)}</span></div>
          </div>
          <div class="card stat">
            <div class="label">Begrenzing</div>
            <div><span class="figure">${esc(limitFigure)}</span>${limitUnit ? `<span class="unit">${esc(limitUnit)}</span>` : ''}</div>
          </div>
        </div>

        <div class="subsection-title">Vermogen</div>
        <div class="card gauge">
          <svg viewBox="0 0 200 130">
            <path d="M 20 110 A 80 80 0 0 1 180 110" stroke="#46443F" stroke-width="14" fill="none" stroke-linecap="round" />
            ${progress > 0.005 ? `<path d="M 20 110 A 80 80 0 ${largeArc} 1 ${endX.toFixed(2)} ${endY.toFixed(2)}" stroke="#C96342" stroke-width="14" fill="none" stroke-linecap="round" />` : ''}
            <line x1="100" y1="110" x2="${needleX.toFixed(2)}" y2="${needleY.toFixed(2)}" stroke="#F0EEE6" stroke-width="2" stroke-linecap="round" />
            <circle cx="100" cy="110" r="5" fill="#F0EEE6" />
          </svg>
          <div class="gauge-value">${formatNumber(power, 0)} W</div>
          <div class="gauge-label">van 6 000 W</div>
        </div>

        <div class="subsection-title">Verloop laatste 24 uur</div>
        <div class="card" style="padding: 12px;">
          ${(() => {
            this._ensureHistory('sensor.zonnepanelen_vermogen', 24);
            const points = this._history['sensor.zonnepanelen_vermogen|24'];
            return points ? lineChart(points, 600, 160, '#C96342') : '<div style="height:160px; display:grid; place-items:center; color:var(--claude-muted); font-size:12px;">Laden…</div>';
          })()}
        </div>

        <h2 class="section-title">Limiet</h2>
        <div class="pills">
          <div class="pill primary" data-script="script.zonnepanelen_aanzetten" data-confirm="Op 100% zetten?">
            <span class="pill-icon">☀</span><span class="pill-label">100%</span>
          </div>
          <div class="pill secondary" data-script="script.zonnepanelen_50_procent" data-confirm="Op 50% zetten?">
            <span class="pill-icon">◐</span><span class="pill-label">50%</span>
          </div>
          <div class="pill secondary" data-script="script.zonnepanelen_25_procent" data-confirm="Op 25% zetten?">
            <span class="pill-icon">◔</span><span class="pill-label">25%</span>
          </div>
          <div class="pill ghost" data-script="script.zonnepanelen_uitschakelen" data-confirm="Volledig uit?">
            <span class="pill-icon">⊘</span><span class="pill-label">Uit</span>
          </div>
        </div>
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────────────
  // VIEW: Media (Spotify + speakers)
  // ──────────────────────────────────────────────────────────────────
  renderMedia(c) {
    // Find first available media_player entity, prefer Spotify
    const allMedia = Object.keys(c.states).filter(eid => eid.startsWith('media_player.'));
    const spotify = allMedia.find(eid => eid.includes('spotify')) || allMedia.find(eid => c.attr(eid, 'app_name') === 'Spotify') || allMedia[0];

    if (!spotify) {
      return `
        <div class="view active">
          <div class="hero"><h1>Media</h1><p>Geen media-player gevonden in Home Assistant.</p></div>
        </div>
      `;
    }

    const state = c.state(spotify);
    const playing = state === 'playing';
    const title = c.attr(spotify, 'media_title') || '—';
    const artist = c.attr(spotify, 'media_artist') || '';
    const album = c.attr(spotify, 'media_album_name') || '';
    const art = c.attr(spotify, 'entity_picture');
    // Veilige URL-validatie: alleen http(s)-prefix of relatief pad accepteren,
    // anders kan een kwaadaardige integratie javascript:/data:-URLs injecteren.
    let artUrl = '';
    if (art) {
      const candidate = art.startsWith('http') ? art : this.client.url + art;
      if (/^https?:\/\//i.test(candidate)) artUrl = candidate;
    }
    const position = parseFloat(c.attr(spotify, 'media_position')) || 0;
    const duration = parseFloat(c.attr(spotify, 'media_duration')) || 0;
    const progressPct = duration > 0 ? Math.min(100, (position / duration) * 100) : 0;
    const volume = c.attr(spotify, 'volume_level');
    const volumePct = volume !== undefined && volume !== '' ? Math.round(volume * 100) : 50;
    const shuffle = c.attr(spotify, 'shuffle');
    const muted = c.attr(spotify, 'is_volume_muted');

    // Other media players (speakers) — alleen deze 4 tonen, gededupliceerd op friendly_name
    const allowedSpeakers = ['Logeerkamer', 'Boven', 'Keuken', 'Woonkamer-TV'];
    const seen = new Set();
    const others = allMedia
      .filter(eid => eid !== spotify)
      .filter(eid => c.state(eid) !== 'unavailable')
      .filter(eid => {
        const name = c.attr(eid, 'friendly_name') || '';
        if (!allowedSpeakers.includes(name)) return false;
        if (seen.has(name)) return false;
        seen.add(name);
        return true;
      });

    return `
      <div class="view active">
        <div class="hero">
          <h1>Media</h1>
          <p>${state === 'playing' ? 'Speelt nu' : state === 'paused' ? 'Gepauzeerd' : 'Inactief'} · ${esc(spotify.replace('media_player.', ''))}</p>
        </div>

        <div class="media-card">
          <div class="album-art">
            ${artUrl ? `<img src="${esc(artUrl)}" alt="album art" />` : '<span class="empty-art">♫</span>'}
          </div>
          <div class="media-info">
            <div class="now">${state === 'playing' ? 'Speelt nu' : state === 'paused' ? 'Gepauzeerd' : 'Inactief'}</div>
            <div class="title">${esc(title)}</div>
            ${artist ? `<div class="artist">${esc(artist)}</div>` : ''}
            ${album ? `<div class="album">${esc(album)}</div>` : ''}

            ${duration > 0 ? `
              <div class="progress-bar"><div style="width: ${progressPct}%"></div></div>
              <div class="progress-times">
                <span>${formatTime(position)}</span>
                <span>${formatTime(duration)}</span>
              </div>
            ` : '<div class="progress-bar"><div style="width:0%"></div></div>'}

            <div class="media-controls">
              <button data-mp-shuffle="${esc(spotify)}" class="${shuffle ? '' : 'muted'}" title="Shuffle">
                <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
              </button>
              <button data-mp-prev="${esc(spotify)}" title="Vorige">
                <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5h2v14H5z"/></svg>
              </button>
              <button class="play" data-mp-toggle="${esc(spotify)}" title="${playing ? 'Pauze' : 'Afspelen'}">
                ${playing
                  ? '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
                  : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
              </button>
              <button data-mp-next="${esc(spotify)}" title="Volgende">
                <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm12 1h2v14h-2z"/></svg>
              </button>
              <button data-mp-mute="${esc(spotify)}" class="${muted ? '' : 'muted'}" title="Mute">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg>
              </button>
            </div>

            <div class="volume">
              <span class="vol-label">Vol</span>
              <input type="range" min="0" max="100" value="${volumePct}" data-mp-volume="${esc(spotify)}" />
              <span class="vol-label">${volumePct}%</span>
            </div>
          </div>
        </div>

        ${others.length ? `
          <div class="subsection-title">Andere speakers</div>
          <div class="speaker-list">
            ${others.map(eid => {
              const s = c.state(eid);
              const playing = s === 'playing';
              const name = c.attr(eid, 'friendly_name') || eid.replace('media_player.', '');
              const t = c.attr(eid, 'media_title');
              return `
                <div class="card tile ${playing ? 'on' : ''}" data-mp-toggle="${esc(eid)}">
                  <div class="icon-circle">♫</div>
                  <div class="info">
                    <div class="name">${esc(name)}</div>
                    <div class="state">${esc(t || (s === 'off' ? 'Uit' : s === 'idle' ? 'Stand-by' : s))}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  // VIEW: Lampen

  renderLampen(c) {
    const switches = ['switch.woonkamerlamp', 'switch.tuinlampen', 'switch.opritlamp', 'switch.spotjes_overkapping'];

      <div class="view active">
        <div class="hero">

  _timerRow(c, eid, label) {
    const t = c.state(eid) || '00:00:00';
    // Forceer HH:MM-shape; voorkom dat een gecompromitteerde input_datetime
    // arbitraire content terugkrijgt naar HTML.
    const safeHhmm = /^\d{2}:\d{2}/.test(t) ? t.substring(0, 5) : '00:00';
    return `
      <div class="row">
        <span class="name">${esc(label)}</span>
        <input type="time" value="${safeHhmm}" data-time="${esc(eid)}" />
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────────────
  // VIEW: Afval
  // ──────────────────────────────────────────────────────────────────
  // Zet de status van een afval-sensor om naar aantal dagen + datum.
  // Werkt met de gangbare varianten: een datum in de attributen, een ISO- of
  // dd-mm-jjjj-datum als status, of woorden ("Vandaag"/"Morgen"/"Overmorgen").
  _wasteInfo(c, eid) {
    const raw = String(c.state(eid) || '').trim();
    if (!raw || raw === 'unknown' || raw === 'unavailable') return null;

    const midnight = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
    const today = midnight(new Date());
    let date = null;

    // 1) Datum uit de attributen (veel afvalkalender-integraties leveren die mee)
    for (const key of ['date', 'next_date', 'collection_date', 'Date', 'day']) {
      const v = c.attr(eid, key);
      if (v) { const d = new Date(v); if (!isNaN(d.getTime())) { date = midnight(d); break; } }
    }
    // 2) Datum in de status zelf
    if (!date) {
      if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
        const d = new Date(raw);
        if (!isNaN(d.getTime())) date = midnight(d);
      } else {
        const m = raw.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
        if (m) date = midnight(new Date(+m[3], +m[2] - 1, +m[1]));
      }
    }

    // 3) Aantal dagen bepalen
    let days = null;
    if (date) {
      days = Math.round((date.getTime() - today.getTime()) / 86400000);
    } else {
      const lc = raw.toLowerCase();
      if (lc.includes('vandaag')) days = 0;
      else if (lc.includes('overmorgen')) days = 2;      // vóór 'morgen' checken
      else if (lc.includes('morgen')) days = 1;
      else { const m = lc.match(/(\d+)\s*dag/); if (m) days = parseInt(m[1], 10); }
    }

    // Niets te rekenen → toon de ruwe status ongewijzigd
    if (days === null || isNaN(days)) return { text: raw, sub: '', days: null, urgency: '' };
    if (!date) date = new Date(today.getTime() + days * 86400000);

    const text = days < 0 ? raw
      : days === 0 ? 'Vandaag'
      : days === 1 ? 'Morgen'
      : days === 2 ? 'Overmorgen'
      : `Over ${days} dagen`;
    const sub = date.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    const urgency = days <= 0 ? 'today' : days === 1 ? 'tomorrow' : days <= 3 ? 'soon' : '';
    return { text, sub, days, urgency };
  }

  renderAfval(c) {
    const items = [
      { eid: 'sensor.pmd', label: 'PMD', desc: 'Plastic, metaal & drinkpakken' },
      { eid: 'sensor.restafval', label: 'Restafval', desc: 'Niet recyclebaar' },
      { eid: 'sensor.papier', label: 'Papier', desc: 'Karton & papier' },
    ].map(i => ({ ...i, info: this._wasteInfo(c, i.eid) }));

    // Eerstvolgende ophaling bovenaan; onbekende status achteraan.
    const sorted = [...items].sort((a, b) => {
      const da = a.info && a.info.days != null ? a.info.days : 9999;
      const db = b.info && b.info.days != null ? b.info.days : 9999;
      return da - db;
    });

    const urgent = sorted.filter(i => i.info && (i.info.days === 0 || i.info.days === 1));
    const next = sorted.find(i => i.info && i.info.days != null);

    return `
      <div class="view active">
        <div class="hero">
          <h1>Afvalkalender</h1>
          <p>${next
            ? `Eerstvolgend: <span class="accent">${esc(next.label)}</span>, ${esc(next.info.text.toLowerCase())}.`
            : 'Volgende ophaaldagen volgens de gemeentekalender.'}</p>
        </div>

        ${urgent.length ? `
          <div class="alert">
            <h2>✱ ${urgent.some(i => i.info.days === 0) ? 'Vandaag' : 'Morgen'} buitenzetten</h2>
            <p>${urgent.map(i => esc(i.label)).join(' · ')}</p>
          </div>
        ` : ''}

        <div class="grid grid-3">
          ${sorted.map(i => {
            const inf = i.info;
            return `
            <div class="card stat waste ${inf ? esc(inf.urgency) : ''}">
              <div class="label">${esc(i.label)}</div>
              <div><span class="figure small">${inf ? esc(inf.text) : '—'}</span></div>
              ${inf && inf.sub ? `<div class="waste-date">${esc(inf.sub)}</div>` : ''}
              <div class="delta muted">${esc(i.desc)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  // ──────────────────────────────────────────────────────────────────
  // VIEW: Weer
  // ──────────────────────────────────────────────────────────────────
  renderWeer(c) {
    const forecast = c.attr('weather.forecast_home', 'forecast') || [];
    const days = forecast.slice(0, 5).map(f => {
      const d = new Date(f.datetime);
      const dow = ['Zon','Maa','Din','Woe','Don','Vrij','Zat'][d.getDay()];
      return `
        <div class="day">
          <div class="dow">${dow}</div>
          <div class="ico">${weatherIcon(f.condition)}</div>
          <div class="hi">${Math.round(f.temperature)}°</div>
          <div class="lo">${Math.round(f.templow || f.temperature - 5)}°</div>
        </div>
      `;
    }).join('');

    const target = c.attr('climate.woonkamer', 'temperature') || 22;
    const current = c.attr('climate.woonkamer', 'current_temperature') || 21;
    const ratio = Math.min(1, Math.max(0, (current - 10) / 20));

    // Extra weersgegevens uit weather.forecast_home attributen
    const humidity = c.attr('weather.forecast_home', 'humidity');
    const windSpeed = c.attr('weather.forecast_home', 'wind_speed');
    const windBearing = c.attr('weather.forecast_home', 'wind_bearing');
    const pressure = c.attr('weather.forecast_home', 'pressure');
    const visibility = c.attr('weather.forecast_home', 'visibility');

    // Zon op / onder uit sun.sun
    const sunrise = c.attr('sun.sun', 'next_rising');
    const sunset = c.attr('sun.sun', 'next_setting');

    // Eerstvolgende neerslag-kans uit forecast (eerste entry met precipitation_probability)
    const nextPrecip = forecast.find(f => f.precipitation_probability != null);

    return `
      <div class="view active">
        <div class="hero">
          <h1>Weer & klimaat</h1>
          <p>Het is nu <span class="accent">${formatNumber(c.attr('weather.forecast_home', 'temperature'), 0)}°C</span> · ${esc(weatherLabel(c.state('weather.forecast_home'))) || '—'}. Binnen op ${formatNumber(current, 0)}°C.</p>
        </div>

        <div class="subsection-title">Buiten nu</div>
        <div class="grid grid-4">
          <div class="card stat">
            <div class="label">Vochtigheid</div>
            <div><span class="figure">${formatNumber(humidity, 0)}</span><span class="unit">%</span></div>
            <div class="delta">Relatieve luchtvochtigheid</div>
          </div>
          <div class="card stat">
            <div class="label">Wind</div>
            <div><span class="figure">${formatNumber(windSpeed, 0)}</span><span class="unit">km/u</span></div>
            <div class="delta">${compassDir(windBearing) || '—'}${windBearing != null && !isNaN(windBearing) ? ' · ' + Math.round(windBearing) + '°' : ''}</div>
          </div>
          <div class="card stat">
            <div class="label">Luchtdruk</div>
            <div><span class="figure">${formatNumber(pressure, 0)}</span><span class="unit">hPa</span></div>
            <div class="delta">${pressure ? (pressure >= 1013 ? 'Hoge druk' : 'Lage druk') : '—'}</div>
          </div>
          <div class="card stat">
            <div class="label">Zicht</div>
            <div><span class="figure">${formatNumber(visibility, 0)}</span><span class="unit">km</span></div>
            <div class="delta">${visibility ? (visibility >= 10 ? 'Helder' : visibility >= 4 ? 'Matig' : 'Beperkt') : '—'}</div>
          </div>
        </div>

        ${(sunrise || sunset || nextPrecip) ? `
          <div class="subsection-title">Zon &amp; neerslag</div>
          <div class="grid grid-3">
            <div class="card stat">
              <div class="label">Zon op</div>
              <div><span class="figure small">${esc(timeOfDay(sunrise))}</span></div>
              <div class="delta">Vandaag of morgen</div>
            </div>
            <div class="card stat">
              <div class="label">Zon onder</div>
              <div><span class="figure small">${esc(timeOfDay(sunset))}</span></div>
              <div class="delta">Vandaag of morgen</div>
            </div>
            <div class="card stat">
              <div class="label">Neerslag-kans</div>
              <div><span class="figure">${nextPrecip ? formatNumber(nextPrecip.precipitation_probability, 0) : '—'}</span><span class="unit">%</span></div>
              <div class="delta">Verwacht vandaag</div>
            </div>
          </div>
        ` : ''}

        <div class="subsection-title">Thermostaat</div>
        <div class="card thermostat">
          <div class="ring" style="background: conic-gradient(var(--claude-primary) 0% ${ratio * 100}%, var(--claude-surface-3) ${ratio * 100}% 100%);">
            <div class="temp">${formatNumber(current, 0)}°</div>
          </div>
          <div style="font-family: var(--serif); font-size: 16px;">Woonkamer</div>
          <div style="color: var(--claude-muted); font-size: 12px; margin-top: 4px;">Doel ${formatNumber(target, 0)}° · ${esc(c.state('climate.woonkamer')) || '—'}</div>
        </div>

        ${(() => {
          // Oude/dubbele core xiaomi_miio-fan uitsluiten (die crasht en is nu
          // vervangen door de Xiaomi Home cloud-entiteit). Verwijder 'm het
          // liefst ook in HA zelf.
          const EXCLUDE = new Set(['fan.woonkamer_ventilator']);
          // Sla verder niet-bereikbare fans over, toon de werkende cloud-fan.
          let fans = c.entityIds('fan.').filter(id => !EXCLUDE.has(id));
          const usable = fans.filter(eid => c.state(eid) !== 'unavailable');
          if (usable.length) fans = usable;
          return fans.length
            ? `<div class="subsection-title">Ventilatie</div>${fans.map(eid => this._fanCard(c, eid) + this._fanSettings(c, eid)).join('')}`
            : '';
        })()}

        ${days ? `
          <div class="subsection-title">5-daagse</div>
          <div class="card">
            <div class="forecast">${days}</div>
          </div>
        ` : ''}
      </div>
    `;
  }

  // Ventilator-kaart (fan.*). Werkt met elke HA-fan (Xiaomi dmaker.fan.1c
  // e.d.): aan/uit, snelheid (percentage), oscilleren en preset-standen.
  _fanCard(c, eid) {
    const on = c.state(eid) === 'on';
    // Nette naam op basis van het apparaat: luchtreiniger vs ventilator.
    const fnLc = (c.attr(eid, 'friendly_name') || '').toLowerCase();
    const isPurifier = fnLc.includes('purifier') || fnLc.includes('luchtreiniger');
    const name = isPurifier ? 'Luchtreiniger' : 'Ventilator';
    const devIds = (c.deviceEntities && c.deviceEntities(eid)) || [];

    // Luchtkwaliteit (PM2.5) van dezelfde luchtreiniger, als die er is.
    let airQuality = '';
    if (isPurifier) {
      const pmId = devIds.find(id => id.startsWith('sensor.') && /pm2/i.test(id));
      const pm = pmId ? parseFloat(c.state(pmId)) : NaN;
      if (!isNaN(pm)) {
        const label = pm <= 12 ? 'goed' : pm <= 35 ? 'matig' : 'slecht';
        airQuality = `PM2.5 ${Math.round(pm)} µg/m³ · ${label}`;
      }
    }

    // Lopende uitschakel-timer. De "resterende tijd"-sensor staat in hele
    // minuten en wordt dus maar 1x per minuut bijgewerkt. We rekenen het
    // eindtijdstip uit (moment van die update + resterende minuten) zodat de
    // teller lokaal per seconde kan meelopen en bij elke HA-update hersynct.
    let timerUntil = 0;
    const remId = devIds.find(id => id.startsWith('sensor.') && /remain|resterend/i.test(id));
    if (remId) {
      const mins = parseFloat(c.state(remId));
      if (!isNaN(mins) && mins > 0) {
        const base = c.lastChanged && c.lastChanged(remId);
        const baseTs = base ? new Date(base).getTime() : Date.now();
        const until = baseTs + mins * 60000;
        if (until > Date.now()) timerUntil = until;
      }
    }
    const pct = Math.round(parseFloat(c.attr(eid, 'percentage')) || 0);
    const osc = !!c.attr(eid, 'oscillating');
    const presets = c.attr(eid, 'preset_modes') || [];
    const curPreset = c.attr(eid, 'preset_mode');
    // Sneller draaien bij hoger vermogen (visuele feedback).
    const spin = on ? Math.max(0.5, 2.4 - (pct / 100) * 1.9).toFixed(2) : 0;
    const fanSvg = `<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"${on ? ` style="animation-duration:${spin}s"` : ''}><path d="M12,11A1,1 0 0,0 11,12A1,1 0 0,0 12,13A1,1 0 0,0 13,12A1,1 0 0,0 12,11M12.5,2C17,2 17.11,5.57 14.75,6.75C13.76,7.24 13.32,8.29 13.13,9.22C13.61,9.42 14.03,9.73 14.35,10.13C18.05,8.13 22.03,8.92 22.03,12.5C22.03,17 18.46,17.1 17.28,14.74C16.78,13.75 15.72,13.31 14.8,13.12C14.6,13.6 14.29,14.02 13.89,14.34C15.89,18.04 15.1,22.02 11.5,22.02C7,22.02 6.92,18.45 9.28,17.27C10.27,16.77 10.71,15.71 10.9,14.79C10.42,14.59 10,14.28 9.68,13.88C5.98,15.88 2,15.09 2,11.5C2,7 5.57,6.92 6.75,9.28C7.24,10.27 8.29,10.71 9.22,10.9C9.42,10.42 9.73,10 10.13,9.68C8.13,5.98 8.92,2 12.5,2Z"/></svg>`;

    // Snelheid: bij een fan met discrete standen (percentage_step, bijv. 33.3
    // = 3 standen) tonen we knoppen i.p.v. een doorlopende slider — die mappen
    // exact op de standen die het apparaat accepteert. Anders: gewone slider.
    const pStep = parseFloat(c.attr(eid, 'percentage_step')) || 0;
    const levels = (pStep > 0 && pStep < 100) ? Math.round(100 / pStep) : 0;
    let speedHtml;
    if (levels >= 2 && levels <= 6) {
      const names3 = ['Laag', 'Midden', 'Hoog'];
      const curLvl = pct <= 0 ? 0 : Math.min(levels, Math.max(1, Math.round(pct / pStep)));
      const btns = Array.from({ length: levels }, (_, i) => {
        const lvl = i + 1;
        // Naar BENEDEN afronden, niet naar het dichtstbijzijnde. Home Assistant
        // rekent een percentage terug naar een stand met ceil(pct/100 * standen),
        // dus 67% op een 3-standen ventilator werd stand 3 en was de middelste
        // stand onbereikbaar. floor(2 * 33,33) = 66 landt wel goed.
        const val = lvl === levels ? 100 : Math.floor(lvl * pStep);
        const label = (levels === 3) ? names3[i] : (levels === 2 ? (i === 0 ? 'Laag' : 'Hoog') : val + '%');
        return `<button class="chip ${lvl === curLvl ? 'active' : ''}" data-fan-speed="${esc(eid)}" data-pct="${val}">${label}</button>`;
      }).join('');
      speedHtml = `<div class="fan-row"><span class="fan-rowlabel">Snelheid</span><div class="set-chips">${btns}</div></div>`;
    } else {
      speedHtml = `<div class="volume fan-speed">
            <span class="vol-label">Snelheid</span>
            <input type="range" min="0" max="100" value="${pct}" data-fan-pct="${esc(eid)}" />
            <span class="vol-label">${pct}%</span>
          </div>`;
    }

    return `
      <div class="card fan ${on ? 'on' : ''}">
        <div class="fan-head">
          <div class="fan-icon">${fanSvg}</div>
          <div class="fan-meta">
            <div class="fan-name">${esc(name)}</div>
            <div class="fan-state">${on ? (pct ? pct + '%' : 'Aan') : 'Uit'}${on && osc ? ' · oscilleert' : ''}${on && airQuality ? ' · ' + esc(airQuality) : ''}</div>
            ${timerUntil ? `<div class="fan-timer"><span class="timer-dot"></span>Gaat uit over <span data-until="${timerUntil}">—</span></div>` : ''}
          </div>
          <div class="switch" data-fan-toggle="${esc(eid)}"></div>
        </div>
        ${on ? `
          ${speedHtml}
          <div class="fan-chips">
            <button class="chip ${osc ? 'active' : ''}" data-fan-osc="${esc(eid)}">⟲ Oscilleren</button>
            ${presets.map(p => `<button class="chip ${p === curPreset ? 'active' : ''}" data-fan-preset="${esc(eid)}" data-preset-mode="${esc(p)}">${esc(this._nl(p))}</button>`).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  // Vertaalt Engelse Xiaomi-benamingen (entity-namen, standen, presets)
  // naar het Nederlands. Valt terug op de originele tekst (met hoofdletter).
  _nl(text) {
    if (!text) return text;
    const t = String(text).toLowerCase().trim();
    const exact = {
      'delay off countdown': 'Timer (uit over)',
      'delay off': 'Timer (uit over)',
      'off delay': 'Timer (uit over)',
      'oscillation angle': 'Draaihoek',
      'swing angle': 'Draaihoek',
      'oscillate angle': 'Draaihoek',
      'fan level': 'Snelheid',
      'fan speed': 'Snelheid',
      'fan mode': 'Modus',
      'child lock': 'Kinderslot',
      'indicator light': 'Lampje',
      'nature mode': 'Natuurlijke wind',
      'natural wind': 'Natuurlijke wind',
      'straight wind': 'Rechte wind',
      'sleep mode': 'Slaapstand',
      'sleeping mode': 'Slaapstand',
      'direct mode': 'Direct',
      'delay time': 'Timer (uit over)',
      // Philips luchtreiniger (AC0951) preset-standen + timer
      'auto': 'Automatisch',
      'turbo': 'Turbo',
      'medium': 'Gemiddeld',
      'sleep': 'Slaapstand',
      'off': 'Uit',
      'allergen': 'Allergenen',
      'bacteria': 'Bacteriën',
    };
    if (exact[t]) return exact[t];
    const partial = [
      ['delay', 'Timer (uit over)'],
      ['countdown', 'Timer (uit over)'],
      ['angle', 'Draaihoek'],
      ['oscillat', 'Oscilleren'],
      ['swing', 'Oscilleren'],
      ['speed', 'Snelheid'],
      ['level', 'Snelheid'],
      ['buzzer', 'Zoemer'],
      ['child lock', 'Kinderslot'],
      ['nature', 'Natuurlijk'],
      ['straight', 'Recht'],
      ['normal', 'Normaal'],
      ['sleep', 'Slaapstand'],
      ['mode', 'Modus'],
    ];
    for (const [k, v] of partial) { if (t.includes(k)) return v; }
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  // Instellingen-kaart voor de ventilator. Pikt automatisch alle entiteiten
  // op die bij hetzelfde apparaat horen (Xiaomi Home maakt losse select/
  // number/switch/light entiteiten voor stand, timer, buzzer, child lock, LED)
  // op basis van gedeelde entity-id of friendly_name. Rendert per type de
  // juiste bediening: select → keuze-chips, number → stepper, switch/light → toggle.
  _fanSettings(c, fanEid) {
    const base = fanEid.slice(fanEid.indexOf('.') + 1);         // "ventilator"
    const fanName = (c.attr(fanEid, 'friendly_name') || '').trim();
    const fanNameLc = fanName.toLowerCase();
    // Alleen stand (select) en timer (number) tonen. Buzzer/child lock/LED
    // (switch/light) laten we bewust weg — die horen niet in dit sfeer-dashboard.
    const domains = ['select', 'number'];
    let rel = [];
    // 1e keuze: entiteiten op hetzelfde HA-apparaat (betrouwbaarst, werkt ook
    // als de namen niet delen — bv. Xiaomi Home ..._s_2_fan vs ..._delay_time_p_9_2).
    const devIds = c.deviceEntities && c.deviceEntities(fanEid);
    if (devIds && devIds.length) {
      devIds.forEach(id => {
        const d = id.split('.')[0];
        if (!domains.includes(d)) return;
        rel.push({ id, d, fn: (c.attr(id, 'friendly_name') || '').trim() });
      });
    } else {
      // Fallback: koppel op gedeelde entity-id / friendly_name-prefix.
      domains.forEach(d => {
        c.entityIds(d + '.').forEach(id => {
          const local = id.slice(d.length + 1);
          const fn = (c.attr(id, 'friendly_name') || '').trim();
          const byId = local === base || local.startsWith(base + '_');
          const byName = fanNameLc.length > 3 && fn.toLowerCase().startsWith(fanNameLc + ' ');
          if (byId || byName) rel.push({ id, d, fn });
        });
      });
    }
    // Beperk tot relevante instellingen: alleen de timer/uitschakel-teller.
    // Apparaten als een luchtreiniger hebben tientallen number/select-
    // entiteiten (helderheid, luchtvochtigheid, filterteller, …) — die willen
    // we hier niet allemaal tonen. Snelheid/standen zitten al op de kaart zelf.
    const KEEP = /(delay|timer|countdown|uitschakel)/i;
    rel = rel.filter(({ id, fn }) => KEEP.test(id) || KEEP.test(fn));
    if (!rel.length) return '';

    const rows = rel.map(({ id, d, fn }) => {
      let label = fn || id.slice(d.length + 1).replace(/_/g, ' ');
      if (fanName && label.toLowerCase().startsWith(fanNameLc + ' ')) label = label.slice(fanName.length).trim();
      label = this._nl(label || id);

      let ctrl = '';
      if (d === 'switch' || d === 'light') {
        const on = c.state(id) === 'on';
        ctrl = `<div class="switch ${on ? 'on' : ''}" data-toggle="${esc(id)}"></div>`;
      } else if (d === 'number') {
        const unit = c.attr(id, 'unit_of_measurement') || '';
        const step = parseFloat(c.attr(id, 'step')) || 1;
        const min = c.attr(id, 'min');
        const max = c.attr(id, 'max');
        const valNum = parseFloat(c.state(id));
        const shown = isNaN(valNum) ? '' : valNum;  // leeg = geen timer (placeholder "uit")
        ctrl = `
          <div class="stepper">
            <button data-num="${esc(id)}" data-num-delta="${-step}" aria-label="min">−</button>
            <input class="stepper-input" type="number" inputmode="numeric"
                   ${min !== '' && min != null ? `min="${esc(min)}"` : ''}
                   ${max !== '' && max != null ? `max="${esc(max)}"` : ''}
                   step="${esc(step)}" value="${esc(shown)}" placeholder="uit"
                   data-num-set="${esc(id)}" />
            ${unit ? `<span class="stepper-unit">${esc(unit)}</span>` : ''}
            <button data-num="${esc(id)}" data-num-delta="${step}" aria-label="plus">+</button>
          </div>`;
      } else if (d === 'select') {
        const opts = c.attr(id, 'options') || [];
        const cur = c.state(id);
        // Weinig opties → knoppen. Veel opties (bv. de Philips-timer met
        // Off + 1h..12h) → keuzelijst, anders krijg je een muur van knoppen.
        if (opts.length > 5) {
          ctrl = `<select class="set-select" data-select-menu="${esc(id)}">${opts.map(o =>
            `<option value="${esc(o)}" ${o === cur ? 'selected' : ''}>${esc(this._nl(o))}</option>`
          ).join('')}</select>`;
        } else {
          ctrl = `<div class="set-chips">${opts.map(o =>
            `<button class="chip ${o === cur ? 'active' : ''}" data-select="${esc(id)}" data-option="${esc(o)}">${esc(this._nl(o))}</button>`
          ).join('')}</div>`;
        }
      }
      return `<div class="set-row"><div class="set-label">${esc(label)}</div><div class="set-ctrl">${ctrl}</div></div>`;
    }).join('');

    return `<div class="card fan-settings"><div class="settings-head">Instellingen</div>${rows}</div>`;
  }

  // ──────────────────────────────────────────────────────────────────
  // VIEW: Benzine
  // ──────────────────────────────────────────────────────────────────
  renderBenzine(c) {
    return `
      <div class="view active">
        <div class="hero">
          <h1>Brandstof</h1>
          <p>Euro 95 (E10) bij <span class="accent">DE</span> en <span class="accent">BE</span> grenstankstations.</p>
        </div>

        <h2 class="section-title">⚐ Duitsland</h2>
        <div class="grid grid-2">
          <div class="card stat">
            <div class="label">OIL · Steyler 157</div>
            <div><span class="figure">${formatNumber(c.state('sensor.oil_steyler_strasse_157_euro_95_loodvrij_e10'), 3)}</span><span class="unit">€/L</span></div>
            <div class="delta">Euro 95 · E10</div>
          </div>
          <div class="card stat">
            <div class="label">Shell · Steyler 179</div>
            <div><span class="figure">${formatNumber(c.state('sensor.shell_steyler_str_179_euro_95_loodvrij_e10'), 3)}</span><span class="unit">€/L</span></div>
            <div class="delta">Euro 95 · E10</div>
          </div>
        </div>

        <h2 class="section-title">⚑ België</h2>
        <div class="grid grid-3">
          <div class="card stat">
            <div class="label">Postcode 3640</div>
            <div><span class="figure">${formatNumber(c.state('sensor.carbu_com_super95_3640_price'), 3)}</span><span class="unit">€/L</span></div>
            <div class="delta">Goedkoopste in postcode</div>
          </div>
          <div class="card stat">
            <div class="label">5 km</div>
            <div><span class="figure">${formatNumber(c.state('sensor.carbu_com_super95_3640_5km'), 3)}</span><span class="unit">€/L</span></div>
            <div class="delta">Beste in 5 km</div>
          </div>
          <div class="card stat">
            <div class="label">10 km</div>
            <div><span class="figure">${formatNumber(c.state('sensor.carbu_com_super95_3640_10km'), 3)}</span><span class="unit">€/L</span></div>
            <div class="delta">Beste in 10 km</div>
          </div>
        </div>
      </div>
    `;
  }
}

const app = new App();
window.app = app;
</script>
</body>
</html>
